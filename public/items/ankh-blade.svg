<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010a04"/>
      <stop offset="60%" stop-color="#041208"/>
      <stop offset="100%" stop-color="#082010"/>
    </linearGradient>
    <!-- Blade with green circuit veins -->
    <linearGradient id="ab-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="40%" stop-color="#5a7a5a"/>
      <stop offset="55%" stop-color="#c0d8c0"/>
      <stop offset="70%" stop-color="#5a7a5a"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <!-- Ankh ring gradient -->
    <linearGradient id="ab-ankh-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a2a"/>
      <stop offset="50%" stop-color="#1a3a1a"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <!-- Crossguard -->
    <linearGradient id="ab-guard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="50%" stop-color="#3a6a3a"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <!-- Hilt -->
    <linearGradient id="ab-hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="50%" stop-color="#2a4a2a"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <radialGradient id="ab-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#39ff14" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab-ankh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <pattern id="ab-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#39ff14" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="ab-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="ab-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ab-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ab-bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#ab-bg)"/>
  <rect width="600" height="600" fill="url(#ab-grid)"/>

  <!-- Green healing aura -->
  <ellipse cx="300" cy="280" rx="180" ry="240" fill="url(#ab-aura)"/>

  <!-- HUD corners - green rare -->
  <g stroke="#39ff14" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD label -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ ANKH-blade ] life-protocol</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">▲ RARE</text>
  </g>

  <!-- BLADE (vertical, tip up) -->
  <g>
    <!-- Outer blade glow -->
    <path d="M 300 290 L 314 410 L 314 470 L 286 470 L 286 410 Z"
          fill="#39ff14" opacity="0.12" filter="url(#ab-bigGlow)"/>

    <!-- Main blade body (below ankh crossguard) -->
    <path d="M 300 290 L 312 410 L 312 468 L 288 468 L 288 410 Z"
          fill="url(#ab-blade)" stroke="#2a5a2a" stroke-width="1.5"/>

    <!-- Life glyph circuit on blade fuller -->
    <line x1="300" y1="298" x2="300" y2="462" stroke="#39ff14" stroke-width="1.5" opacity="0.7" filter="url(#ab-softGlow)"/>
    <!-- Circuit nodes on blade -->
    <g fill="#39ff14" opacity="0.8" filter="url(#ab-hardGlow)">
      <circle cx="300" cy="330" r="2.5"/>
      <circle cx="300" cy="370" r="2.5"/>
      <circle cx="300" cy="410" r="2"/>
    </g>
    <!-- Horizontal circuit branches -->
    <g stroke="#39ff14" stroke-width="0.8" opacity="0.5">
      <line x1="300" y1="330" x2="290" y2="325"/>
      <line x1="300" y1="330" x2="310" y2="325"/>
      <line x1="300" y1="370" x2="288" y2="365"/>
      <line x1="300" y1="370" x2="312" y2="365"/>
    </g>
  </g>

  <!-- ANKH SYMBOL (forms the crossguard and pommel) -->
  <g>
    <!-- Ankh outer glow -->
    <circle cx="300" cy="200" r="72" fill="#39ff14" opacity="0.06" filter="url(#ab-bigGlow)"/>

    <!-- ANKH RING (oval loop at top) -->
    <!-- Outer ring glow -->
    <circle cx="300" cy="200" r="68" fill="none" stroke="#39ff14" stroke-width="6" opacity="0.18" filter="url(#ab-softGlow)"/>
    <!-- Ring body -->
    <circle cx="300" cy="200" r="60" fill="url(#ab-ankh-metal)" stroke="#39ff14" stroke-width="3"/>
    <circle cx="300" cy="200" r="48" fill="#041208" stroke="#39ff14" stroke-width="1" opacity="0.7"/>
    <!-- Inner ring glow -->
    <circle cx="300" cy="200" r="48" fill="url(#ab-ankh-glow)" opacity="0.25"/>

    <!-- Life glyph inside ankh ring (ankh interior decoration) -->
    <g stroke="#39ff14" stroke-width="1" fill="none" opacity="0.6">
      <circle cx="300" cy="200" r="32" stroke-dasharray="5 5"/>
    </g>
    <g fill="#39ff14" font-family="ui-monospace" font-size="22" text-anchor="middle" opacity="0.8" filter="url(#ab-hardGlow)">
      <text x="300" y="209">☥</text>
    </g>

    <!-- ANKH CROSSBAR (horizontal arm of ankh = crossguard) -->
    <rect x="222" y="258" width="156" height="18" rx="4" fill="url(#ab-guard)" stroke="#39ff14" stroke-width="2"/>
    <!-- Crossbar glow -->
    <rect x="222" y="258" width="156" height="18" rx="4" fill="#39ff14" opacity="0.04" filter="url(#ab-softGlow)"/>
    <!-- Crossbar end ornaments -->
    <circle cx="222" cy="267" r="8" fill="#1a3a1a" stroke="#39ff14" stroke-width="1.5"/>
    <circle cx="378" cy="267" r="8" fill="#1a3a1a" stroke="#39ff14" stroke-width="1.5"/>
    <circle cx="222" cy="267" r="3" fill="#39ff14" opacity="0.7" filter="url(#ab-hardGlow)"/>
    <circle cx="378" cy="267" r="3" fill="#39ff14" opacity="0.7" filter="url(#ab-hardGlow)"/>

    <!-- ANKH VERTICAL STEM above crossbar (connects ring to crossbar) -->
    <rect x="293" y="258" width="14" height="2" fill="#1a3a1a"/>

    <!-- HILT (below blade, long section) -->
    <rect x="289" y="468" width="22" height="60" rx="5" fill="url(#ab-hilt)" stroke="#39ff14" stroke-width="1.5"/>
    <!-- Hilt wraps -->
    <g stroke="#39ff14" stroke-width="1" opacity="0.4">
      <line x1="289" y1="480" x2="311" y2="482"/>
      <line x1="289" y1="492" x2="311" y2="494"/>
      <line x1="289" y1="504" x2="311" y2="506"/>
    </g>

    <!-- POMMEL (teardrop/crux ansata bottom) -->
    <ellipse cx="300" cy="537" rx="16" ry="18" fill="url(#ab-hilt)" stroke="#39ff14" stroke-width="2"/>
    <ellipse cx="300" cy="537" rx="8" ry="9" fill="#39ff14" opacity="0.35" filter="url(#ab-softGlow)"/>
    <circle cx="300" cy="537" r="4" fill="#39ff14" opacity="0.8" filter="url(#ab-hardGlow)"/>
  </g>

  <!-- Green healing particles rising from blade -->
  <g fill="#39ff14" opacity="0.5" filter="url(#ab-hardGlow)">
    <circle cx="260" cy="390" r="1.5"/>
    <circle cx="340" cy="360" r="1"/>
    <circle cx="252" cy="430" r="1"/>
    <circle cx="348" cy="400" r="1.5"/>
    <circle cx="265" cy="310" r="1"/>
    <circle cx="335" cy="340" r="1"/>
    <circle cx="245" cy="260" r="1"/>
    <circle cx="355" cy="290" r="1"/>
  </g>

  <!-- Pulsing ring decorations (life-cycle arcs) -->
  <g stroke="#39ff14" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="4 6">
    <circle cx="300" cy="200" r="90"/>
    <circle cx="300" cy="200" r="108"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#ab-scanlines)" opacity="0.4"/>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#ab-vignette)"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// LIFE-CHARGE: ACTIVE · HEAL: ON-HIT</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 1.4K</text>
  </g>
</svg>
