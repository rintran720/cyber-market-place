<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080806"/>
      <stop offset="60%" stop-color="#100f08"/>
      <stop offset="100%" stop-color="#1a1808"/>
    </linearGradient>
    <!-- Feather blade gradient (gray-silver with slight warm tint) -->
    <linearGradient id="fm-feather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1c18"/>
      <stop offset="35%" stop-color="#6a7060"/>
      <stop offset="55%" stop-color="#c8ccc0"/>
      <stop offset="75%" stop-color="#6a7060"/>
      <stop offset="100%" stop-color="#0e1010"/>
    </linearGradient>
    <linearGradient id="fm-guard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1808"/>
      <stop offset="50%" stop-color="#6a5a30"/>
      <stop offset="100%" stop-color="#1a1808"/>
    </linearGradient>
    <linearGradient id="fm-hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2818"/>
      <stop offset="50%" stop-color="#3a3220"/>
      <stop offset="100%" stop-color="#0e0e08"/>
    </linearGradient>
    <radialGradient id="fm-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c8b060" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#c8b060" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#c8b060" stop-opacity="0"/>
    </radialGradient>
    <!-- Sand haze gradient -->
    <radialGradient id="fm-sand" cx="0.5" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#c8a060" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8a060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fm-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <pattern id="fm-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#8a92a3" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="fm-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="fm-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fm-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#fm-bg)"/>
  <rect width="600" height="600" fill="url(#fm-grid)"/>

  <!-- Aura behind weapon -->
  <ellipse cx="300" cy="280" rx="160" ry="250" fill="url(#fm-aura)"/>

  <!-- Sand haze at bottom -->
  <ellipse cx="300" cy="560" rx="300" ry="100" fill="url(#fm-sand)"/>

  <!-- HUD corners - gray common -->
  <g stroke="#8a92a3" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD label -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#8a92a3" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ FEATHER-of-MAAT ] ceremonial</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end" fill="#8a92a3">COMMON</text>
  </g>

  <!-- FEATHER-SHAPED BLADE (vertical, tip up) -->
  <g>
    <!-- Outer glow -->
    <path d="M 300 100 C 335 120 350 170 350 240 C 350 310 330 370 300 400 C 270 370 250 310 250 240 C 250 170 265 120 300 100 Z"
          fill="#c8ccc0" opacity="0.08" filter="url(#fm-softGlow)"/>

    <!-- Feather blade left edge (slightly curved left) -->
    <!-- Feather shape: tapers to sharp tip at top, widens into central spine, has barb-like curves on sides -->
    <path d="M 300 100
             C 318 130 328 175 325 230 C 322 280 312 360 308 400
             L 292 400
             C 288 360 278 280 275 230 C 272 175 282 130 300 100 Z"
          fill="url(#fm-feather)" stroke="#4a4a38" stroke-width="1"/>

    <!-- Feather barbs left side (fine diagonal lines suggesting feather vanes) -->
    <g stroke="#6a7060" stroke-width="0.7" opacity="0.55">
      <path d="M 292 140 C 272 148 258 158 248 165"/>
      <path d="M 290 158 C 268 166 252 178 242 188"/>
      <path d="M 288 178 C 264 188 248 202 236 214"/>
      <path d="M 285 200 C 260 212 242 228 230 242"/>
      <path d="M 283 222 C 258 236 240 252 228 268"/>
      <path d="M 282 244 C 258 258 242 276 232 292"/>
      <path d="M 281 268 C 258 282 244 300 236 316"/>
      <path d="M 281 294 C 260 308 248 326 242 342"/>
      <path d="M 282 322 C 264 334 256 350 252 364"/>
    </g>
    <!-- Feather barbs right side -->
    <g stroke="#6a7060" stroke-width="0.7" opacity="0.55">
      <path d="M 308 140 C 328 148 342 158 352 165"/>
      <path d="M 310 158 C 332 166 348 178 358 188"/>
      <path d="M 312 178 C 336 188 352 202 364 214"/>
      <path d="M 315 200 C 340 212 358 228 370 242"/>
      <path d="M 317 222 C 342 236 360 252 372 268"/>
      <path d="M 318 244 C 342 258 358 276 368 292"/>
      <path d="M 319 268 C 342 282 356 300 364 316"/>
      <path d="M 319 294 C 340 308 352 326 358 342"/>
      <path d="M 318 322 C 336 334 344 350 348 364"/>
    </g>

    <!-- Central spine/fuller -->
    <line x1="300" y1="108" x2="300" y2="398" stroke="#c8ccc0" stroke-width="1.5" opacity="0.5"/>
    <!-- Spine glow (faint warm tint) -->
    <line x1="300" y1="108" x2="300" y2="398" stroke="#f0d890" stroke-width="0.8" opacity="0.2"/>

    <!-- Blade tip -->
    <circle cx="300" cy="102" r="3" fill="#c8ccc0" opacity="0.9"/>
    <circle cx="300" cy="102" r="5" fill="#c8b060" opacity="0.2" filter="url(#fm-softGlow)"/>
  </g>

  <!-- GUARD (crossguard with ornamental Egyptian look) -->
  <g>
    <!-- Hieroglyph engraved guard -->
    <rect x="248" y="397" width="104" height="18" rx="3" fill="#2a2618" stroke="#6a5a30" stroke-width="1.5"/>
    <!-- Guard outer ornament tips -->
    <path d="M 248 397 L 234 406 L 248 415" fill="#2a2618" stroke="#6a5a30" stroke-width="1"/>
    <path d="M 352 397 L 366 406 L 352 415" fill="#2a2618" stroke="#6a5a30" stroke-width="1"/>
    <!-- Hieroglyph symbols on guard -->
    <g font-family="serif" font-size="13" fill="#c8a060" text-anchor="middle" opacity="0.7">
      <text x="265" y="411">𓁡</text>
      <text x="300" y="411">𓆣</text>
      <text x="335" y="411">𓁩</text>
    </g>
    <!-- Guard center jewel (Maat's eye) -->
    <ellipse cx="300" cy="406" rx="6" ry="5" fill="#c8a060" opacity="0.6" filter="url(#fm-hardGlow)"/>
  </g>

  <!-- HILT -->
  <g>
    <rect x="289" y="415" width="22" height="76" rx="5" fill="url(#fm-hilt)" stroke="#4a4228" stroke-width="1.5"/>
    <!-- Hilt wraps (Egyptian linen-style) -->
    <g stroke="#6a5a30" stroke-width="1.2" opacity="0.5">
      <line x1="289" y1="428" x2="311" y2="430"/>
      <line x1="289" y1="440" x2="311" y2="442"/>
      <line x1="289" y1="452" x2="311" y2="454"/>
      <line x1="289" y1="464" x2="311" y2="466"/>
      <line x1="289" y1="476" x2="311" y2="478"/>
    </g>
    <!-- Pommel (scarab-shaped disc) -->
    <ellipse cx="300" cy="498" rx="18" ry="12" fill="#2a2618" stroke="#6a5a30" stroke-width="1.5"/>
    <ellipse cx="300" cy="498" rx="9" ry="6" fill="#c8a060" opacity="0.3" filter="url(#fm-hardGlow)"/>
    <text x="300" y="502" font-family="serif" font-size="10" text-anchor="middle" fill="#c8a060" opacity="0.8">𓆣</text>
  </g>

  <!-- Sand particle haze (faint dots distributed around) -->
  <g fill="#c8a060" opacity="0.2">
    <circle cx="200" cy="280" r="1.5"/>
    <circle cx="400" cy="250" r="1"/>
    <circle cx="185" cy="350" r="1"/>
    <circle cx="415" cy="380" r="1.5"/>
    <circle cx="230" cy="440" r="1"/>
    <circle cx="370" cy="430" r="1"/>
    <circle cx="160" cy="300" r="1"/>
    <circle cx="440" cy="300" r="1"/>
    <circle cx="210" cy="200" r="1"/>
    <circle cx="390" cy="180" r="1"/>
    <circle cx="260" cy="490" r="1"/>
    <circle cx="340" cy="480" r="1"/>
  </g>

  <!-- "CEREMONIAL FINISH" faint watermark -->
  <g opacity="0.2">
    <text x="300" y="340" font-family="ui-monospace, 'Courier New', monospace" font-size="9"
          letter-spacing="2" text-anchor="middle" fill="#8a92a3">CEREMONIAL FINISH</text>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#fm-scanlines)" opacity="0.4"/>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#fm-vignette)"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#8a92a3" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// TRUTH: WEIGHTED · MAAT-SEALED</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 0.4K</text>
  </g>
</svg>
