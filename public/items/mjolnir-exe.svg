<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02030d"/>
      <stop offset="60%" stop-color="#06082a"/>
      <stop offset="100%" stop-color="#170836"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#0066aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4358"/>
      <stop offset="50%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <linearGradient id="metalEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e18"/>
      <stop offset="50%" stop-color="#5a6b85"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>

    <linearGradient id="haft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="50%" stop-color="#2a3045"/>
      <stop offset="100%" stop-color="#0c0f1a"/>
    </linearGradient>

    <pattern id="grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- Vanishing perspective floor -->
  <g opacity="0.35">
    <line x1="300" y1="600" x2="50" y2="380" stroke="#ff00ea" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="300" y1="600" x2="170" y2="380" stroke="#ff00ea" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="300" y1="600" x2="430" y2="380" stroke="#ff00ea" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="300" y1="600" x2="550" y2="380" stroke="#ff00ea" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0" y1="500" x2="600" y2="500" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="0" y1="450" x2="600" y2="450" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="0" y1="420" x2="600" y2="420" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <!-- Big aura behind hammer head -->
  <ellipse cx="300" cy="200" rx="240" ry="200" fill="url(#aura)"/>

  <!-- HUD frame corners -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD label top -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#00f0ff" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ MJOLNIR.exe ] v2185.4.2</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end" fill="#fcee0a">★ LEGENDARY</text>
  </g>

  <!-- HAFT (handle) -->
  <g>
    <!-- Outer shadow -->
    <rect x="280" y="220" width="40" height="320" fill="#000" opacity="0.5"/>
    <!-- Main haft -->
    <rect x="282" y="220" width="36" height="320" fill="url(#haft)"/>
    <!-- Edge highlight -->
    <rect x="282" y="220" width="2" height="320" fill="#5a6b85" opacity="0.6"/>
    <rect x="316" y="220" width="2" height="320" fill="#0a0e18"/>

    <!-- Haft circuit traces -->
    <g stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.7">
      <line x1="290" y1="260" x2="290" y2="500"/>
      <line x1="310" y1="280" x2="310" y2="480"/>
      <line x1="290" y1="260" x2="295" y2="265"/>
      <line x1="310" y1="280" x2="305" y2="285"/>
      <circle cx="290" cy="280" r="2" fill="#00f0ff"/>
      <circle cx="310" cy="320" r="2" fill="#00f0ff"/>
      <circle cx="290" cy="380" r="2" fill="#00f0ff"/>
      <circle cx="310" cy="430" r="2" fill="#00f0ff"/>
    </g>

    <!-- Rune marks on haft -->
    <g font-family="serif" fill="#00f0ff" opacity="0.85" filter="url(#hardGlow)" font-size="14" text-anchor="middle">
      <text x="300" y="305">ᚦ</text>
      <text x="300" y="355">ᛟ</text>
      <text x="300" y="405">ᚱ</text>
    </g>

    <!-- Pommel -->
    <rect x="270" y="535" width="60" height="20" fill="url(#metal)"/>
    <rect x="270" y="535" width="60" height="2" fill="#5a6b85"/>
    <circle cx="300" cy="568" r="14" fill="url(#metal)" stroke="#5a6b85" stroke-width="1"/>
    <circle cx="300" cy="568" r="6" fill="#00f0ff" filter="url(#softGlow)"/>
  </g>

  <!-- HAMMER HEAD (hexagonal) -->
  <g>
    <!-- Glow behind head -->
    <polygon points="180,150 230,90 370,90 420,150 420,260 370,320 230,320 180,260"
             fill="#00f0ff" opacity="0.18" filter="url(#softGlow)"/>

    <!-- Main head body -->
    <polygon points="180,150 230,90 370,90 420,150 420,260 370,320 230,320 180,260"
             fill="url(#metal)" stroke="url(#metalEdge)" stroke-width="2"/>

    <!-- Inner panel -->
    <polygon points="200,160 240,110 360,110 400,160 400,250 360,300 240,300 200,250"
             fill="#0a0e18" stroke="#3a4358" stroke-width="1"/>

    <!-- Tech panel lines -->
    <g stroke="#3a4358" stroke-width="1" fill="none">
      <line x1="200" y1="180" x2="400" y2="180"/>
      <line x1="200" y1="230" x2="400" y2="230"/>
      <line x1="200" y1="270" x2="400" y2="270"/>
    </g>

    <!-- Rivet bolts -->
    <g fill="#5a6b85">
      <circle cx="195" cy="158" r="3"/>
      <circle cx="405" cy="158" r="3"/>
      <circle cx="195" cy="252" r="3"/>
      <circle cx="405" cy="252" r="3"/>
      <circle cx="240" cy="105" r="3"/>
      <circle cx="360" cy="105" r="3"/>
      <circle cx="240" cy="305" r="3"/>
      <circle cx="360" cy="305" r="3"/>
    </g>

    <!-- ENERGY CORE (cyan glow) -->
    <circle cx="300" cy="205" r="80" fill="url(#coreGlow)" opacity="0.6" filter="url(#softGlow)"/>
    <circle cx="300" cy="205" r="55" fill="url(#coreGlow)" filter="url(#softGlow)"/>
    <circle cx="300" cy="205" r="38" fill="#ffffff" opacity="0.95"/>
    <circle cx="300" cy="205" r="38" fill="none" stroke="#00f0ff" stroke-width="2"/>

    <!-- Inner core ring -->
    <circle cx="300" cy="205" r="48" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
    <circle cx="300" cy="205" r="62" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4"
            stroke-dasharray="4 6"/>

    <!-- Core ID hex -->
    <text x="300" y="210" font-family="ui-monospace, 'Courier New', monospace"
          font-size="12" fill="#02030d" font-weight="700" text-anchor="middle">⚡</text>
  </g>

  <!-- LIGHTNING BOLTS -->
  <g stroke="#ffffff" stroke-width="2" fill="none" filter="url(#softGlow)" opacity="0.95">
    <path d="M 130 110 L 160 130 L 145 145 L 175 175"/>
    <path d="M 470 110 L 440 130 L 455 145 L 425 175"/>
    <path d="M 100 230 L 140 240 L 130 260 L 165 270"/>
    <path d="M 500 230 L 460 240 L 470 260 L 435 270"/>
  </g>

  <!-- Smaller magenta sparks -->
  <g stroke="#ff00ea" stroke-width="1.5" fill="none" filter="url(#softGlow)" opacity="0.7">
    <path d="M 80 180 L 100 175"/>
    <path d="M 520 180 L 500 175"/>
    <path d="M 70 140 L 90 145"/>
    <path d="M 530 140 L 510 145"/>
  </g>

  <!-- Hex particles -->
  <g fill="#00f0ff" opacity="0.6" filter="url(#hardGlow)">
    <polygon points="60,400 65,395 70,400 70,408 65,413 60,408"/>
    <polygon points="540,420 545,415 550,420 550,428 545,433 540,428"/>
    <polygon points="80,510 84,506 88,510 88,516 84,520 80,516"/>
    <polygon points="510,490 514,486 518,490 518,496 514,500 510,496"/>
  </g>

  <!-- SCANLINES OVERLAY -->
  <rect width="600" height="600" fill="url(#scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#00f0ff" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// PWR 1.21 GW · IDLE</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 4.2K</text>
  </g>
</svg>
