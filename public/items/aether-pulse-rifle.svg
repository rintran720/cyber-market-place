<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="apr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02030d"/>
      <stop offset="55%" stop-color="#080520"/>
      <stop offset="100%" stop-color="#170836"/>
    </linearGradient>

    <radialGradient id="apr-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#bd00ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="apr-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="50%" stop-color="#4a2a6a"/>
      <stop offset="100%" stop-color="#1a0a28"/>
    </linearGradient>

    <linearGradient id="apr-bodyEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="50%" stop-color="#9a50d0"/>
      <stop offset="100%" stop-color="#0a0514"/>
    </linearGradient>

    <radialGradient id="apr-chargeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#bd00ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#5500aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="apr-energyCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#bd00ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#bd00ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="apr-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#bd00ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <pattern id="apr-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>

    <filter id="apr-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="apr-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="apr-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#apr-bg)"/>
  <rect width="600" height="600" fill="url(#apr-grid)"/>

  <!-- Purple aura -->
  <ellipse cx="290" cy="300" rx="260" ry="110" fill="url(#apr-aura)"/>

  <!-- HUD frame corners -->
  <g stroke="#bd00ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#bd00ff" opacity="0.9">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ AETHER.pulse-rifle ] olympus-armory</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">◇ EPIC</text>
  </g>

  <!-- PULSE RIFLE - horizontal, muzzle pointing right -->
  <g>
    <!-- Butt stock -->
    <path d="M 60,268 L 120,268 L 120,332 L 100,342 L 60,342 Z" fill="url(#apr-body)" stroke="url(#apr-bodyEdge)" stroke-width="1.5"/>
    <line x1="60" y1="280" x2="118" y2="280" stroke="#bd00ff" stroke-width="0.8" opacity="0.5"/>
    <line x1="60" y1="310" x2="118" y2="310" stroke="#bd00ff" stroke-width="0.8" opacity="0.5"/>

    <!-- Stock shoulder pad -->
    <rect x="55" y="275" width="8" height="55" rx="2" fill="#3a1a50" stroke="#6a30a0" stroke-width="1"/>

    <!-- Main receiver body -->
    <rect x="118" y="272" width="200" height="60" rx="3" fill="url(#apr-body)" stroke="url(#apr-bodyEdge)" stroke-width="1.5"/>

    <!-- CHARGE CORE (purple energy cell on receiver) -->
    <rect x="160" y="280" width="80" height="44" rx="2" fill="#0a0518" stroke="#bd00ff" stroke-width="2"/>
    <rect x="163" y="283" width="74" height="38" rx="1" fill="url(#apr-energyCell)" filter="url(#apr-softGlow)" opacity="0.8"/>
    <line x1="200" y1="283" x2="200" y2="321" stroke="#ffffff" stroke-width="1.5" opacity="0.6" filter="url(#apr-softGlow)"/>
    <!-- Charge indicator LEDs -->
    <g fill="#bd00ff" filter="url(#apr-hardGlow)">
      <circle cx="168" cy="304" r="2.5"/>
      <circle cx="175" cy="304" r="2.5"/>
      <circle cx="182" cy="304" r="2.5"/>
      <circle cx="189" cy="304" r="2.5"/>
      <circle cx="196" cy="304" r="2.5"/>
    </g>

    <!-- Grip / trigger section -->
    <path d="M 315,272 L 340,272 L 348,300 L 348,338 L 328,348 L 312,348 L 312,330 L 318,305 Z"
          fill="url(#apr-body)" stroke="#6a30a0" stroke-width="1.5"/>
    <!-- Trigger -->
    <path d="M 328,315 L 338,313 L 340,328 L 330,330" fill="none" stroke="#bd00ff" stroke-width="1" opacity="0.7"/>

    <!-- Forward barrel section -->
    <rect x="345" y="278" width="80" height="48" rx="2" fill="url(#apr-body)" stroke="url(#apr-bodyEdge)" stroke-width="1.5"/>
    <!-- Barrel vent slots -->
    <g stroke="#bd00ff" stroke-width="1" opacity="0.5">
      <line x1="355" y1="284" x2="355" y2="320"/>
      <line x1="365" y1="284" x2="365" y2="320"/>
      <line x1="375" y1="284" x2="375" y2="320"/>
      <line x1="385" y1="284" x2="385" y2="320"/>
      <line x1="395" y1="284" x2="395" y2="320"/>
      <line x1="405" y1="284" x2="405" y2="320"/>
    </g>

    <!-- Join ring -->
    <rect x="423" y="276" width="8" height="52" fill="#bd00ff" opacity="0.6"/>

    <!-- Muzzle section with taper -->
    <path d="M 430,282 L 530,288 L 532,316 L 430,322 Z" fill="url(#apr-body)" stroke="url(#apr-bodyEdge)" stroke-width="1.5"/>
    <!-- Muzzle energy buildup rings -->
    <circle cx="530" cy="302" r="22" fill="#bd00ff" opacity="0.15" filter="url(#apr-softGlow)"/>
    <circle cx="530" cy="302" r="16" fill="none" stroke="#bd00ff" stroke-width="1.5" opacity="0.6"/>
    <circle cx="530" cy="302" r="10" fill="none" stroke="#bd00ff" stroke-width="2" opacity="0.8"/>
    <circle cx="530" cy="302" r="26" fill="url(#apr-chargeGlow)" filter="url(#apr-softGlow)" opacity="0.7"/>
    <circle cx="530" cy="302" r="8" fill="#ffffff" opacity="0.9"/>

    <!-- SCOPE on top -->
    <rect x="160" y="250" width="120" height="24" rx="5" fill="#2a1a3a" stroke="#8a40c0" stroke-width="1.5"/>
    <!-- Scope lens rings -->
    <circle cx="200" cy="262" r="9" fill="#0a0518" stroke="#bd00ff" stroke-width="1.5"/>
    <circle cx="200" cy="262" r="5" fill="#bd00ff" opacity="0.3" filter="url(#apr-hardGlow)"/>
    <circle cx="260" cy="262" r="6" fill="#0a0518" stroke="#9a30d0" stroke-width="1"/>
    <!-- Rail -->
    <line x1="162" y1="259" x2="278" y2="259" stroke="#bd00ff" stroke-width="0.8" opacity="0.5"/>
    <line x1="162" y1="265" x2="278" y2="265" stroke="#bd00ff" stroke-width="0.8" opacity="0.5"/>

    <!-- Under-barrel grip handle -->
    <path d="M 370,326 L 390,326 L 390,360 L 375,366 L 365,360 L 365,335 Z" fill="#2a1a3a" stroke="#6a30a0" stroke-width="1"/>

    <!-- Side LED indicators on receiver -->
    <g fill="#bd00ff" filter="url(#apr-hardGlow)" opacity="0.9">
      <rect x="130" y="284" width="6" height="12" rx="1"/>
      <rect x="140" y="284" width="6" height="12" rx="1"/>
      <rect x="130" y="308" width="6" height="12" rx="1"/>
    </g>

    <!-- Circuit traces -->
    <g stroke="#bd00ff" stroke-width="0.8" fill="none" opacity="0.5">
      <line x1="125" y1="278" x2="125" y2="326"/>
      <circle cx="125" cy="300" r="2" fill="#bd00ff"/>
      <line x1="450" y1="284" x2="450" y2="318"/>
      <circle cx="450" cy="300" r="2" fill="#bd00ff"/>
      <line x1="480" y1="290" x2="480" y2="312"/>
      <circle cx="480" cy="302" r="1.5" fill="#bd00ff"/>
    </g>
  </g>

  <!-- Purple energy sparks -->
  <g stroke="#bd00ff" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#apr-softGlow)">
    <path d="M 100,200 L 130,210"/>
    <path d="M 100,400 L 130,390"/>
    <path d="M 490,180 L 510,195"/>
    <path d="M 490,420 L 510,405"/>
  </g>

  <!-- Energy particles -->
  <g fill="#bd00ff" opacity="0.65" filter="url(#apr-hardGlow)">
    <circle cx="150" cy="180" r="2"/>
    <circle cx="450" cy="180" r="1.5"/>
    <circle cx="130" cy="420" r="2"/>
    <circle cx="470" cy="430" r="1.5"/>
    <circle cx="100" cy="300" r="1"/>
    <circle cx="500" cy="300" r="1.5"/>
    <circle cx="200" cy="160" r="1"/>
    <circle cx="400" cy="150" r="1"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#apr-scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#bd00ff" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// CHARGE: 100% · PULSE MODE · READY</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 2.9K</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#apr-vignette)"/>
</svg>
