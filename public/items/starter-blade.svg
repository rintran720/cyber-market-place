<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06070d"/>
      <stop offset="60%" stop-color="#0e1018"/>
      <stop offset="100%" stop-color="#181b22"/>
    </linearGradient>
    <linearGradient id="sb-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2e3a"/>
      <stop offset="40%" stop-color="#7a8299"/>
      <stop offset="55%" stop-color="#c8cdd8"/>
      <stop offset="70%" stop-color="#7a8299"/>
      <stop offset="100%" stop-color="#1e2230"/>
    </linearGradient>
    <linearGradient id="sb-guard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1d26"/>
      <stop offset="50%" stop-color="#4a5060"/>
      <stop offset="100%" stop-color="#1a1d26"/>
    </linearGradient>
    <linearGradient id="sb-grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d28"/>
      <stop offset="50%" stop-color="#252a38"/>
      <stop offset="100%" stop-color="#0e1018"/>
    </linearGradient>
    <radialGradient id="sb-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a92a3" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8a92a3" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8a92a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sb-cyanaccent" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sb-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <pattern id="sb-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#8a92a3" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="sb-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="sb-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sb-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#sb-bg)"/>
  <rect width="600" height="600" fill="url(#sb-grid)"/>

  <!-- Subtle aura behind blade -->
  <ellipse cx="300" cy="280" rx="120" ry="260" fill="url(#sb-aura)"/>

  <!-- Faint cyan edge accent glow -->
  <ellipse cx="300" cy="200" rx="20" ry="200" fill="url(#sb-cyanaccent)" opacity="0.3"/>

  <!-- HUD corners - gray for common -->
  <g stroke="#8a92a3" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD label -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#8a92a3" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ STARTER.blade ] tutorial-issue</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end" fill="#8a92a3">COMMON</text>
  </g>

  <!-- BLADE (vertical, tip up) -->
  <g>
    <!-- Outer glow on blade -->
    <path d="M 300 100 L 316 310 L 316 390 L 284 390 L 284 310 Z"
          fill="#8a92a3" opacity="0.12" filter="url(#sb-softGlow)"/>

    <!-- Blade body -->
    <path d="M 300 100 L 314 310 L 314 390 L 286 390 L 286 310 Z"
          fill="url(#sb-blade)" stroke="#4a5060" stroke-width="1.5"/>

    <!-- Blade fuller center line (gray) -->
    <line x1="300" y1="115" x2="300" y2="385" stroke="#8a92a3" stroke-width="1.5" opacity="0.5"/>

    <!-- Cyan accent edge line (single thin cyan line on the right edge) -->
    <line x1="313" y1="120" x2="313" y2="380" stroke="#00d4ff" stroke-width="1" opacity="0.5" filter="url(#sb-hardGlow)"/>

    <!-- Tech tick marks on blade -->
    <g stroke="#8a92a3" stroke-width="0.8" opacity="0.4">
      <line x1="295" y1="180" x2="305" y2="180"/>
      <line x1="295" y1="220" x2="305" y2="220"/>
      <line x1="295" y1="260" x2="305" y2="260"/>
      <line x1="295" y1="300" x2="305" y2="300"/>
      <line x1="295" y1="340" x2="305" y2="340"/>
    </g>

    <!-- Minimal circuit dots on blade -->
    <g fill="#00d4ff" opacity="0.45" filter="url(#sb-hardGlow)">
      <circle cx="300" cy="200" r="2"/>
      <circle cx="300" cy="280" r="2"/>
      <circle cx="300" cy="350" r="1.5"/>
    </g>

    <!-- Blade tip highlight -->
    <polygon points="294,115 300,96 306,115" fill="#c8cdd8" opacity="0.8"/>
    <circle cx="300" cy="100" r="3" fill="#00d4ff" opacity="0.6" filter="url(#sb-softGlow)"/>
  </g>

  <!-- CROSS-GUARD (simple, sturdy) -->
  <g>
    <rect x="250" y="387" width="100" height="16" rx="2" fill="url(#sb-guard)" stroke="#4a5060" stroke-width="1.5"/>
    <!-- Guard end caps -->
    <rect x="246" y="391" width="8" height="8" rx="1" fill="#3a3f50" stroke="#4a5060" stroke-width="1"/>
    <rect x="346" y="391" width="8" height="8" rx="1" fill="#3a3f50" stroke="#4a5060" stroke-width="1"/>
    <!-- Guard center mark -->
    <line x1="295" y1="391" x2="305" y2="399" stroke="#8a92a3" stroke-width="0.8" opacity="0.5"/>
    <line x1="305" y1="391" x2="295" y2="399" stroke="#8a92a3" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- GRIP -->
  <g>
    <rect x="289" y="403" width="22" height="82" rx="4" fill="url(#sb-grip)" stroke="#3a3f50" stroke-width="1.5"/>
    <!-- Grip wraps - simple parallel lines -->
    <g stroke="#8a92a3" stroke-width="1.2" opacity="0.4">
      <line x1="289" y1="415" x2="311" y2="417"/>
      <line x1="289" y1="426" x2="311" y2="428"/>
      <line x1="289" y1="437" x2="311" y2="439"/>
      <line x1="289" y1="448" x2="311" y2="450"/>
      <line x1="289" y1="459" x2="311" y2="461"/>
      <line x1="289" y1="470" x2="311" y2="472"/>
    </g>
    <!-- Simple pommel -->
    <rect x="283" y="485" width="34" height="12" rx="3" fill="#2a2e3a" stroke="#4a5060" stroke-width="1.5"/>
    <circle cx="300" cy="505" r="10" fill="#1e2230" stroke="#4a5060" stroke-width="1.5"/>
    <circle cx="300" cy="505" r="4" fill="#8a92a3" opacity="0.5"/>
  </g>

  <!-- "TUTORIAL ISSUE" stamp - slightly degraded look -->
  <g opacity="0.35">
    <rect x="218" y="258" width="164" height="22" rx="2" fill="none" stroke="#8a92a3" stroke-width="1"/>
    <text x="300" y="273" font-family="ui-monospace, 'Courier New', monospace" font-size="10"
          letter-spacing="3" text-anchor="middle" fill="#8a92a3">TUTORIAL ISSUE</text>
  </g>

  <!-- Minimal ambient particles -->
  <g fill="#8a92a3" opacity="0.3">
    <circle cx="220" cy="250" r="1"/>
    <circle cx="380" cy="200" r="1"/>
    <circle cx="230" cy="380" r="1"/>
    <circle cx="370" cy="350" r="1.5"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#sb-scanlines)" opacity="0.4"/>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#sb-vignette)"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#8a92a3" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// GRADE: 0 · ISSUED AT SPAWN</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 0.1K</text>
  </g>
</svg>
