<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ld-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010a04"/>
      <stop offset="60%" stop-color="#041208"/>
      <stop offset="100%" stop-color="#0a2010"/>
    </linearGradient>
    <radialGradient id="ld-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#39ff14" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ld-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="45%" stop-color="#6a8a6a"/>
      <stop offset="65%" stop-color="#cce0cc"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <linearGradient id="ld-hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="50%" stop-color="#2a4a2a"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <pattern id="ld-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#39ff14" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="ld-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="ld-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ld-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ld-glitch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="ld-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#ld-bg)"/>
  <rect width="600" height="600" fill="url(#ld-grid)"/>

  <!-- Green trickster aura -->
  <ellipse cx="300" cy="300" rx="200" ry="180" fill="url(#ld-aura)"/>

  <!-- HUD corners -->
  <g stroke="#39ff14" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ LOKI.dagger ] shadow-trade-net</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">▲ RARE</text>
  </g>

  <!-- S-SHAPED TWISTED BLADE (vertical, point upward) -->
  <g>
    <!-- Glitch-fracture offset copies of blade (slightly displaced, RGB-split effect) -->
    <!-- Red channel offset -->
    <g opacity="0.35">
      <path d="M 310,130 C 330,160 290,200 310,240 C 330,280 280,320 300,360 L 296,380 L 276,380 L 272,360 C 292,320 242,280 262,240 C 282,200 242,160 262,130 Z"
            fill="#ff0000" opacity="0.4" transform="translate(6, -3)"/>
    </g>
    <!-- Blue channel offset -->
    <g opacity="0.35">
      <path d="M 310,130 C 330,160 290,200 310,240 C 330,280 280,320 300,360 L 296,380 L 276,380 L 272,360 C 292,320 242,280 262,240 C 282,200 242,160 262,130 Z"
            fill="#0000ff" opacity="0.4" transform="translate(-6, 3)"/>
    </g>

    <!-- MAIN S-BLADE -->
    <!-- Upper curve of S (tilts right going up) -->
    <!-- Lower curve of S (tilts left) -->
    <path d="M 310,130 C 335,155 295,195 315,238 C 335,282 278,318 298,362 L 294,382 L 274,382 L 270,362 C 290,318 233,282 253,238 C 273,195 233,155 258,130 Z"
          fill="url(#ld-blade)" stroke="#39ff14" stroke-width="1.5"/>

    <!-- S-curve highlight lines -->
    <path d="M 306,135 C 328,158 290,198 310,240 C 330,282 276,318 296,362"
          fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" filter="url(#ld-softGlow)"/>

    <!-- Blade tip (top) -->
    <polygon points="284,128 300,95 316,128" fill="#cce0cc" opacity="0.9" filter="url(#ld-softGlow)"/>
    <circle cx="300" cy="98" r="5" fill="#39ff14" opacity="0.8" filter="url(#ld-softGlow)"/>

    <!-- Glitch fracture segments (pieces offset) -->
    <g opacity="0.7">
      <!-- Offset blade segment 1 (upper) -->
      <path d="M 290,155 C 310,165 308,180 305,195 L 295,195 C 292,180 290,165 270,155 Z"
            fill="#cce0cc" opacity="0.6" transform="translate(8, 0)"/>
      <!-- Offset blade segment 2 (lower) -->
      <path d="M 270,290 C 250,300 255,315 258,330 L 268,330 C 271,315 266,300 286,290 Z"
            fill="#cce0cc" opacity="0.6" transform="translate(-10, 0)"/>
    </g>

    <!-- RGB split outline traces -->
    <path d="M 310,130 C 335,155 295,195 315,238 C 335,282 278,318 298,362"
          fill="none" stroke="#39ff14" stroke-width="1" opacity="0.8" filter="url(#ld-hardGlow)"/>

    <!-- CROSS-GUARD -->
    <rect x="240" y="380" width="120" height="14" rx="3" fill="#1a2a1a" stroke="#39ff14" stroke-width="1.5"/>
    <!-- Guard accent lines -->
    <line x1="248" y1="387" x2="352" y2="387" stroke="#39ff14" stroke-width="0.8" opacity="0.5"/>

    <!-- HILT -->
    <rect x="282" y="394" width="36" height="80" rx="6" fill="url(#ld-hilt)" stroke="#39ff14" stroke-width="1.5"/>
    <!-- Hilt wraps -->
    <g stroke="#39ff14" stroke-width="1.2" opacity="0.5">
      <line x1="282" y1="408" x2="318" y2="410"/>
      <line x1="282" y1="420" x2="318" y2="422"/>
      <line x1="282" y1="432" x2="318" y2="434"/>
      <line x1="282" y1="444" x2="318" y2="446"/>
      <line x1="282" y1="456" x2="318" y2="458"/>
    </g>

    <!-- POMMEL - MOCKING FACE (Loki's face) -->
    <g transform="translate(300, 490)">
      <circle cx="0" cy="0" r="22" fill="#1a2a1a" stroke="#39ff14" stroke-width="2"/>
      <!-- Pointy ears/horns (Loki helmet) -->
      <polygon points="-12,-18 -18,-30 -6,-18" fill="#1a2a1a" stroke="#39ff14" stroke-width="1.5"/>
      <polygon points="12,-18 18,-30 6,-18" fill="#1a2a1a" stroke="#39ff14" stroke-width="1.5"/>
      <!-- Eyes (mischievous, asymmetric) -->
      <ellipse cx="-7" cy="-5" rx="4" ry="3" fill="#39ff14" opacity="0.9" filter="url(#ld-hardGlow)"/>
      <ellipse cx="7" cy="-6" rx="3" ry="4" fill="#39ff14" opacity="0.9" filter="url(#ld-hardGlow)"/>
      <!-- Smirk mouth -->
      <path d="M -8 8 C -4 14, 6 14, 10 8" fill="none" stroke="#39ff14" stroke-width="1.5"/>
      <!-- Tongue out -->
      <path d="M 2 13 C 2 18, 0 21, -2 20" stroke="#39ff14" stroke-width="1" fill="none"/>
      <!-- Raised eyebrow (mocking) -->
      <path d="M -10 -9 C -8 -12, -4 -12, -3 -9" fill="none" stroke="#39ff14" stroke-width="1"/>
    </g>
  </g>

  <!-- Glitch energy particles -->
  <g fill="#39ff14" opacity="0.6" filter="url(#ld-hardGlow)">
    <circle cx="240" cy="190" r="2"/>
    <circle cx="360" cy="200" r="1.5"/>
    <circle cx="220" cy="300" r="1"/>
    <circle cx="380" cy="290" r="1.5"/>
    <circle cx="245" cy="360" r="2"/>
    <circle cx="355" cy="350" r="1.5"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#ld-scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// MISS-CHANCE: 5% · LAUGHING: ENABLED</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 1.1K</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#ld-vignette)"/>
</svg>
