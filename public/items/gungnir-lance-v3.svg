<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0500"/>
      <stop offset="60%" stop-color="#1f1800"/>
      <stop offset="100%" stop-color="#3a2a00"/>
    </linearGradient>

    <radialGradient id="gl-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fcee0a" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#fcee0a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gl-barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="50%" stop-color="#4a4a60"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>

    <linearGradient id="gl-barrelEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#8a8aaa"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>

    <linearGradient id="gl-energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fcee0a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fcee0a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#fcee0a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="gl-coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fcee0a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gl-muzzle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fcee0a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gl-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#fcee0a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <pattern id="gl-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>

    <filter id="gl-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="gl-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="gl-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#gl-bg)"/>
  <rect width="600" height="600" fill="url(#gl-grid)"/>

  <!-- Yellow aura behind spear-launcher -->
  <ellipse cx="300" cy="300" rx="260" ry="120" fill="url(#gl-aura)"/>

  <!-- HUD frame corners -->
  <g stroke="#fcee0a" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#fcee0a" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ GUNGNIR-Lance v3.2 ] norse-arsenal</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">★ LEGENDARY</text>
  </g>

  <!-- SPEAR-LAUNCHER body (horizontal) -->
  <g>
    <!-- Main barrel shadow -->
    <rect x="80" y="293" width="430" height="28" fill="#000" opacity="0.4"/>

    <!-- Rear stock section -->
    <rect x="82" y="277" width="120" height="50" rx="4" fill="url(#gl-barrel)" stroke="url(#gl-barrelEdge)" stroke-width="1.5"/>
    <rect x="82" y="286" width="120" height="4" fill="#6a6a80" opacity="0.5"/>

    <!-- Grip / trigger housing -->
    <path d="M 200,275 L 220,275 L 230,300 L 230,330 L 210,340 L 195,340 L 195,325 L 200,305 Z"
          fill="url(#gl-barrel)" stroke="#5a5a70" stroke-width="1.5"/>

    <!-- Trigger detail -->
    <path d="M 210,310 L 218,310 L 218,325 L 210,325" fill="none" stroke="#fcee0a" stroke-width="1" opacity="0.6"/>

    <!-- Barrel segments - multi-segmented -->
    <rect x="225" y="282" width="80" height="40" rx="2" fill="url(#gl-barrel)" stroke="url(#gl-barrelEdge)" stroke-width="1.5"/>
    <!-- segment join ring -->
    <rect x="303" y="280" width="6" height="44" fill="#fcee0a" opacity="0.6"/>

    <rect x="308" y="284" width="90" height="36" rx="2" fill="url(#gl-barrel)" stroke="url(#gl-barrelEdge)" stroke-width="1.5"/>
    <!-- segment join ring -->
    <rect x="396" y="282" width="6" height="40" fill="#fcee0a" opacity="0.5"/>

    <rect x="401" y="287" width="80" height="30" rx="2" fill="url(#gl-barrel)" stroke="url(#gl-barrelEdge)" stroke-width="1.5"/>

    <!-- Energy core in barrel - glowing yellow channel -->
    <rect x="230" y="298" width="246" height="8" fill="url(#gl-energy)" filter="url(#gl-softGlow)" opacity="0.8"/>
    <line x1="230" y1="302" x2="476" y2="302" stroke="#ffffff" stroke-width="1" opacity="0.6" filter="url(#gl-softGlow)"/>

    <!-- Side fins / stabilizers -->
    <g fill="#3a3a50" stroke="#5a5a70" stroke-width="1">
      <polygon points="250,282 260,260 280,260 280,282"/>
      <polygon points="360,282 370,258 390,258 390,282"/>
      <polygon points="250,322 260,344 280,344 280,322"/>
      <polygon points="360,322 370,346 390,346 390,322"/>
    </g>
    <!-- Fin energy strips -->
    <line x1="262" y1="261" x2="278" y2="261" stroke="#fcee0a" stroke-width="1.5" opacity="0.7"/>
    <line x1="372" y1="259" x2="388" y2="259" stroke="#fcee0a" stroke-width="1.5" opacity="0.7"/>
    <line x1="262" y1="342" x2="278" y2="342" stroke="#fcee0a" stroke-width="1.5" opacity="0.7"/>
    <line x1="372" y1="345" x2="388" y2="345" stroke="#fcee0a" stroke-width="1.5" opacity="0.7"/>

    <!-- Scope on top -->
    <rect x="280" y="260" width="80" height="22" rx="4" fill="#2a2a38" stroke="#6a6a80" stroke-width="1"/>
    <circle cx="320" cy="271" r="8" fill="#0a0a14" stroke="#fcee0a" stroke-width="1.5"/>
    <circle cx="320" cy="271" r="4" fill="#fcee0a" opacity="0.3" filter="url(#gl-hardGlow)"/>
    <!-- Scope rails -->
    <line x1="282" y1="268" x2="358" y2="268" stroke="#fcee0a" stroke-width="0.8" opacity="0.5"/>
    <line x1="282" y1="274" x2="358" y2="274" stroke="#fcee0a" stroke-width="0.8" opacity="0.5"/>

    <!-- SPEAR TIP / muzzle pointing right -->
    <path d="M 480,287 L 520,302 L 480,317 Z" fill="url(#gl-barrelEdge)" stroke="#fcee0a" stroke-width="1.5"/>
    <path d="M 480,290 L 515,302 L 480,314 Z" fill="#fcee0a" opacity="0.3"/>
    <!-- Muzzle glow - energy buildup -->
    <circle cx="516" cy="302" r="18" fill="url(#gl-muzzle)" filter="url(#gl-softGlow)" opacity="0.8"/>
    <circle cx="516" cy="302" r="8" fill="#ffffff" opacity="0.9"/>

    <!-- Targeting laser dot (thin line) -->
    <line x1="518" y1="302" x2="580" y2="302" stroke="#ff3333" stroke-width="1" opacity="0.85" stroke-dasharray="2 3"/>
    <circle cx="580" cy="302" r="3" fill="#ff3333" opacity="0.9" filter="url(#gl-hardGlow)"/>

    <!-- Back nock / butt -->
    <path d="M 82,280 L 60,290 L 60,314 L 82,325" fill="url(#gl-barrel)" stroke="#5a5a70" stroke-width="1"/>

    <!-- Circuit traces on barrel body -->
    <g stroke="#fcee0a" stroke-width="0.8" fill="none" opacity="0.5">
      <line x1="240" y1="286" x2="240" y2="318"/>
      <line x1="240" y1="295" x2="248" y2="295"/>
      <line x1="240" y1="310" x2="248" y2="310"/>
      <circle cx="244" cy="295" r="1.5" fill="#fcee0a"/>
      <circle cx="244" cy="310" r="1.5" fill="#fcee0a"/>
      <line x1="420" y1="290" x2="420" y2="316"/>
      <circle cx="420" cy="302" r="2" fill="#fcee0a"/>
    </g>

    <!-- Rune marks on barrel -->
    <g font-family="serif" fill="#fcee0a" opacity="0.7" filter="url(#gl-hardGlow)" font-size="12" text-anchor="middle">
      <text x="100" y="306">ᚷ</text>
      <text x="130" y="306">ᚢ</text>
      <text x="160" y="306">ᚾ</text>
    </g>
  </g>

  <!-- Energy particles -->
  <g fill="#fcee0a" opacity="0.7" filter="url(#gl-hardGlow)">
    <circle cx="150" cy="220" r="1.5"/>
    <circle cx="450" cy="200" r="2"/>
    <circle cx="120" cy="400" r="1.5"/>
    <circle cx="480" cy="420" r="1.5"/>
    <circle cx="200" cy="180" r="1"/>
    <circle cx="400" cy="180" r="1"/>
  </g>

  <!-- Speed lines toward muzzle -->
  <g stroke="#fcee0a" stroke-width="1" fill="none" opacity="0.5">
    <line x1="180" y1="280" x2="220" y2="285"/>
    <line x1="180" y1="325" x2="220" y2="320"/>
    <line x1="140" y1="275" x2="185" y2="278"/>
    <line x1="140" y1="330" x2="185" y2="327"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#gl-scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#fcee0a" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// HOMING: ACTIVE · RNG 88 · LOCKED</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 5.8K</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#gl-vignette)"/>
</svg>
