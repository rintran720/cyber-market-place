<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="60%" stop-color="#0c0e18"/>
      <stop offset="100%" stop-color="#141620"/>
    </linearGradient>
    <radialGradient id="ss-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a92a3" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#8a92a3" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8a92a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ss-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="40%" stop-color="#6a7285"/>
      <stop offset="70%" stop-color="#aab0c0"/>
      <stop offset="100%" stop-color="#1a1e28"/>
    </linearGradient>
    <linearGradient id="ss-wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1e28"/>
      <stop offset="50%" stop-color="#4a5268"/>
      <stop offset="100%" stop-color="#1a1e28"/>
    </linearGradient>
    <linearGradient id="ss-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4050"/>
      <stop offset="50%" stop-color="#8a92a3"/>
      <stop offset="100%" stop-color="#2a2e38"/>
    </linearGradient>
    <pattern id="ss-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#8a92a3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="ss-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="ss-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ss-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="ss-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#ss-bg)"/>
  <rect width="600" height="600" fill="url(#ss-grid)"/>

  <!-- Gray aura -->
  <ellipse cx="300" cy="300" rx="200" ry="180" fill="url(#ss-aura)"/>

  <!-- HUD corners -->
  <g stroke="#8a92a3" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#8a92a3" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ SCARAB-shuriken ] duat-cyberware</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">COMMON</text>
  </g>

  <!-- GIANT SCARAB SHURIKEN (central, large, beetle-shaped throwing star) -->
  <g transform="translate(300, 300)">
    <!-- 5 blade points radiating outward (shuriken tips) -->
    <!-- Blade 1 (top) -->
    <polygon points="0,-30 -14,-80 0,-120 14,-80" fill="url(#ss-blade)" stroke="#8a92a3" stroke-width="1.5"/>
    <!-- Blade 2 (upper right) -->
    <polygon points="28,-12 78,-35 100,-10 55,18" fill="url(#ss-blade)" stroke="#8a92a3" stroke-width="1.5"/>
    <!-- Blade 3 (lower right) -->
    <polygon points="22,24 62,62 48,88 18,48" fill="url(#ss-blade)" stroke="#8a92a3" stroke-width="1.5"/>
    <!-- Blade 4 (lower left) -->
    <polygon points="-22,24 -62,62 -48,88 -18,48" fill="url(#ss-blade)" stroke="#8a92a3" stroke-width="1.5"/>
    <!-- Blade 5 (upper left) -->
    <polygon points="-28,-12 -78,-35 -100,-10 -55,18" fill="url(#ss-blade)" stroke="#8a92a3" stroke-width="1.5"/>

    <!-- SCARAB SHELL body (main body, elliptical) -->
    <!-- Back shell halves (iridescent wings open) -->
    <!-- Left wing -->
    <path d="M -8 -5 C -45 -20, -65 -5, -60 22 C -55 40, -30 45, -8 30 Z"
          fill="url(#ss-wing)" stroke="#6a7285" stroke-width="1.5" opacity="0.9"/>
    <!-- Wing sheen lines -->
    <g stroke="#aab0c0" stroke-width="0.6" opacity="0.5">
      <line x1="-12" y1="0" x2="-50" y2="5"/>
      <line x1="-12" y1="8" x2="-48" y2="16"/>
      <line x1="-12" y1="16" x2="-44" y2="26"/>
    </g>
    <!-- Right wing -->
    <path d="M 8 -5 C 45 -20, 65 -5, 60 22 C 55 40, 30 45, 8 30 Z"
          fill="url(#ss-wing)" stroke="#6a7285" stroke-width="1.5" opacity="0.9"/>
    <g stroke="#aab0c0" stroke-width="0.6" opacity="0.5">
      <line x1="12" y1="0" x2="50" y2="5"/>
      <line x1="12" y1="8" x2="48" y2="16"/>
      <line x1="12" y1="16" x2="44" y2="26"/>
    </g>

    <!-- Main carapace (body center) -->
    <ellipse cx="0" cy="12" rx="20" ry="30" fill="url(#ss-shell)" stroke="#8a92a3" stroke-width="2"/>
    <!-- Shell ridge lines -->
    <line x1="0" y1="-18" x2="0" y2="42" stroke="#aab0c0" stroke-width="1" opacity="0.6"/>
    <ellipse cx="0" cy="12" rx="10" ry="15" fill="none" stroke="#6a7285" stroke-width="1" opacity="0.5"/>

    <!-- SCARAB HEAD (pronatal, at top) -->
    <ellipse cx="0" cy="-20" rx="14" ry="12" fill="url(#ss-shell)" stroke="#8a92a3" stroke-width="1.5"/>
    <!-- Head clypeus (horn-like projection) -->
    <path d="M -6 -30 C -5 -38, 5 -38, 6 -30" fill="url(#ss-shell)" stroke="#8a92a3" stroke-width="1.5"/>

    <!-- MECHANICAL HINGE LEGS (6 visible) -->
    <g stroke="#6a7285" stroke-width="1.2" fill="none">
      <!-- Front legs -->
      <path d="M -12 -8 C -28 -14, -38 -8, -42 0"/>
      <path d="M 12 -8 C 28 -14, 38 -8, 42 0"/>
      <!-- Mid legs -->
      <path d="M -16 8 C -32 4, -44 10, -48 20"/>
      <path d="M 16 8 C 32 4, 44 10, 48 20"/>
      <!-- Back legs -->
      <path d="M -14 24 C -28 28, -36 38, -34 48"/>
      <path d="M 14 24 C 28 28, 36 38, 34 48"/>
      <!-- Leg joints (mechanic hinges) -->
      <circle cx="-38" cy="-2" r="2" fill="#8a92a3"/>
      <circle cx="38" cy="-2" r="2" fill="#8a92a3"/>
      <circle cx="-46" cy="18" r="2" fill="#8a92a3"/>
      <circle cx="46" cy="18" r="2" fill="#8a92a3"/>
      <circle cx="-36" cy="44" r="2" fill="#8a92a3"/>
      <circle cx="36" cy="44" r="2" fill="#8a92a3"/>
    </g>

    <!-- Center hub glow -->
    <circle cx="0" cy="12" r="8" fill="#8a92a3" opacity="0.4" filter="url(#ss-softGlow)"/>
    <circle cx="0" cy="12" r="4" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Ambient particles -->
  <g fill="#8a92a3" opacity="0.5" filter="url(#ss-hardGlow)">
    <circle cx="120" cy="180" r="2"/>
    <circle cx="480" cy="170" r="1.5"/>
    <circle cx="100" cy="440" r="1"/>
    <circle cx="490" cy="430" r="1.5"/>
    <circle cx="80" cy="310" r="1"/>
    <circle cx="510" cy="300" r="1.5"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#ss-scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#8a92a3" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// PACK: 12 · SPIN-RATE: MAX · HINGE: LOCKED</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 0.18K</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#ss-vignette)"/>
</svg>
