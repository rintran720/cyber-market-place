<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010a04"/>
      <stop offset="60%" stop-color="#041208"/>
      <stop offset="100%" stop-color="#082010"/>
    </linearGradient>
    <!-- Bone flute body -->
    <linearGradient id="tf-bone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2a18"/>
      <stop offset="25%" stop-color="#5a7050"/>
      <stop offset="50%" stop-color="#c8d4c0"/>
      <stop offset="75%" stop-color="#5a7050"/>
      <stop offset="100%" stop-color="#0e1a0c"/>
    </linearGradient>
    <!-- Bone marrow texture interior -->
    <linearGradient id="tf-marrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1808"/>
      <stop offset="50%" stop-color="#1a2c18"/>
      <stop offset="100%" stop-color="#0a1808"/>
    </linearGradient>
    <radialGradient id="tf-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#39ff14" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tf-hole-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tf-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <pattern id="tf-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#39ff14" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="tf-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <!-- Bone marrow inner texture (subtle porous look) -->
    <pattern id="tf-marrow-pat" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#0a1808" fill-opacity="0.4"/>
      <circle cx="2" cy="2" r="0.8" fill="#0a1808" fill-opacity="0.25"/>
      <circle cx="8" cy="8" r="1" fill="#0a1808" fill-opacity="0.3"/>
    </pattern>
    <filter id="tf-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tf-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tf-waveBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#tf-bg)"/>
  <rect width="600" height="600" fill="url(#tf-grid)"/>

  <!-- Green haze aura (sound/confusion motif) -->
  <ellipse cx="300" cy="310" rx="200" ry="200" fill="url(#tf-aura)"/>

  <!-- HUD corners - green rare -->
  <g stroke="#39ff14" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD label -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ TRICKSTER.flute ] anansi-bone</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">▲ RARE</text>
  </g>

  <!-- VERTICAL BONE FLUTE (centered) -->
  <g>
    <!-- Flute outer glow -->
    <rect x="279" y="100" width="42" height="420" rx="18" fill="#39ff14" opacity="0.05" filter="url(#tf-softGlow)"/>

    <!-- Flute outer body (tapered bone cylinder) -->
    <rect x="282" y="102" width="36" height="420" rx="16" fill="url(#tf-bone)" stroke="#2a5a28" stroke-width="1.5"/>

    <!-- Marrow texture overlay -->
    <rect x="282" y="102" width="36" height="420" rx="16" fill="url(#tf-marrow-pat)" opacity="0.5"/>

    <!-- Bone segment rings (wrap marks at bone joints) -->
    <g stroke="#3a5a38" stroke-width="2" fill="none" opacity="0.6">
      <line x1="283" y1="180" x2="317" y2="180"/>
      <line x1="283" y1="310" x2="317" y2="310"/>
      <line x1="283" y1="440" x2="317" y2="440"/>
    </g>
    <!-- Ring detail -->
    <g stroke="#6a9060" stroke-width="0.8" fill="none" opacity="0.4">
      <line x1="283" y1="176" x2="317" y2="176"/>
      <line x1="283" y1="184" x2="317" y2="184"/>
      <line x1="283" y1="306" x2="317" y2="306"/>
      <line x1="283" y1="314" x2="317" y2="314"/>
      <line x1="283" y1="436" x2="317" y2="436"/>
      <line x1="283" y1="444" x2="317" y2="444"/>
    </g>

    <!-- Inner marrow canal (darker center line) -->
    <rect x="294" y="105" width="12" height="416" rx="5" fill="url(#tf-marrow)" opacity="0.6"/>

    <!-- TOP - Mouthpiece (wider, rounded) -->
    <ellipse cx="300" cy="106" rx="22" ry="14" fill="#3a5a38" stroke="#39ff14" stroke-width="2"/>
    <ellipse cx="300" cy="106" rx="14" ry="8" fill="#0a1808" stroke="#39ff14" stroke-width="1" opacity="0.8"/>

    <!-- ANANSI SPIDER EMBLEM at mouthpiece -->
    <g transform="translate(300, 106)" filter="url(#tf-hardGlow)">
      <!-- Spider body (small ovoid) -->
      <ellipse cx="0" cy="0" rx="5" ry="6" fill="#39ff14" opacity="0.85"/>
      <!-- Spider head -->
      <circle cx="0" cy="-8" r="3.5" fill="#39ff14" opacity="0.85"/>
      <!-- Spider eyes -->
      <circle cx="-1.5" cy="-9" r="0.8" fill="#000"/>
      <circle cx="1.5" cy="-9" r="0.8" fill="#000"/>
      <!-- Spider legs (4 on each side) -->
      <g stroke="#39ff14" stroke-width="0.8" fill="none" opacity="0.9">
        <line x1="-5" y1="-2" x2="-14" y2="-8"/>
        <line x1="-5" y1="0" x2="-14" y2="0"/>
        <line x1="-5" y1="2" x2="-13" y2="6"/>
        <line x1="-5" y1="4" x2="-12" y2="10"/>
        <line x1="5" y1="-2" x2="14" y2="-8"/>
        <line x1="5" y1="0" x2="14" y2="0"/>
        <line x1="5" y1="2" x2="13" y2="6"/>
        <line x1="5" y1="4" x2="12" y2="10"/>
      </g>
    </g>

    <!-- 5 FINGER HOLES (glowing green) - evenly spaced along flute body -->
    <!-- Hole 1 -->
    <circle cx="300" cy="210" r="9" fill="#000" stroke="#39ff14" stroke-width="2"/>
    <circle cx="300" cy="210" r="6" fill="url(#tf-hole-glow)" filter="url(#tf-hardGlow)"/>
    <!-- Hole 2 -->
    <circle cx="300" cy="262" r="9" fill="#000" stroke="#39ff14" stroke-width="2"/>
    <circle cx="300" cy="262" r="6" fill="url(#tf-hole-glow)" filter="url(#tf-hardGlow)"/>
    <!-- Hole 3 -->
    <circle cx="300" cy="314" r="9" fill="#000" stroke="#39ff14" stroke-width="2"/>
    <circle cx="300" cy="314" r="6" fill="url(#tf-hole-glow)" filter="url(#tf-hardGlow)"/>
    <!-- Hole 4 -->
    <circle cx="300" cy="366" r="9" fill="#000" stroke="#39ff14" stroke-width="2"/>
    <circle cx="300" cy="366" r="6" fill="url(#tf-hole-glow)" filter="url(#tf-hardGlow)"/>
    <!-- Hole 5 -->
    <circle cx="300" cy="418" r="9" fill="#000" stroke="#39ff14" stroke-width="2"/>
    <circle cx="300" cy="418" r="6" fill="url(#tf-hole-glow)" filter="url(#tf-hardGlow)"/>

    <!-- BOTTOM end of flute (rounded cap) -->
    <ellipse cx="300" cy="519" rx="20" ry="12" fill="#3a5a38" stroke="#39ff14" stroke-width="1.5"/>
    <ellipse cx="300" cy="519" rx="10" ry="6" fill="#0a1808"/>
  </g>

  <!-- SOUND WAVES emanating sideways (target AI confusion motif) -->
  <!-- Left side waves -->
  <g stroke="#39ff14" stroke-width="1.5" fill="none" opacity="0.7" filter="url(#tf-waveBlur)">
    <path d="M 270 210 C 248 218 245 228 248 238 C 245 248 248 258 270 262"/>
    <path d="M 270 210 C 238 218 232 232 238 245 C 232 258 238 268 270 262"/>
    <path d="M 270 210 C 225 220 218 238 225 252 C 218 266 225 278 270 262"/>
  </g>
  <!-- Right side waves -->
  <g stroke="#39ff14" stroke-width="1.5" fill="none" opacity="0.7" filter="url(#tf-waveBlur)">
    <path d="M 330 314 C 352 322 355 332 352 342 C 355 352 352 362 330 366"/>
    <path d="M 330 314 C 362 322 368 336 362 349 C 368 362 362 372 330 366"/>
    <path d="M 330 314 C 375 324 382 342 375 356 C 382 370 375 382 330 366"/>
  </g>

  <!-- Confused AI target markers (glitching HUD elements suggesting target confusion) -->
  <g stroke="#39ff14" stroke-width="1" fill="none" opacity="0.35" filter="url(#tf-hardGlow)">
    <!-- Broken targeting reticle left -->
    <circle cx="155" cy="236" r="18"/>
    <line x1="137" y1="236" x2="128" y2="236"/>
    <line x1="173" y1="236" x2="182" y2="236"/>
    <line x1="155" y1="218" x2="155" y2="209"/>
    <line x1="155" y1="254" x2="155" y2="263"/>
    <!-- Glitch offset on reticle -->
    <circle cx="159" cy="233" r="8" stroke-dasharray="3 5"/>
  </g>
  <g stroke="#39ff14" stroke-width="1" fill="none" opacity="0.3" filter="url(#tf-hardGlow)">
    <!-- Broken targeting reticle right -->
    <circle cx="445" cy="348" r="15"/>
    <line x1="430" y1="348" x2="422" y2="348"/>
    <line x1="460" y1="348" x2="468" y2="348"/>
    <!-- Glitch X marker -->
    <line x1="436" y1="339" x2="454" y2="357"/>
    <line x1="454" y1="339" x2="436" y2="357"/>
  </g>

  <!-- Green particles -->
  <g fill="#39ff14" opacity="0.5" filter="url(#tf-hardGlow)">
    <circle cx="220" cy="200" r="1.5"/>
    <circle cx="380" cy="180" r="1"/>
    <circle cx="195" cy="320" r="1"/>
    <circle cx="405" cy="310" r="1.5"/>
    <circle cx="215" cy="420" r="1"/>
    <circle cx="390" cy="400" r="1"/>
    <circle cx="170" cy="270" r="1"/>
    <circle cx="430" cy="260" r="1"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#tf-scanlines)" opacity="0.4"/>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#tf-vignette)"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// AI-CONFUSE: 60% · ANANSI-BLESSED</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 1.8K</text>
  </g>
</svg>
