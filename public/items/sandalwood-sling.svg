<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070605"/>
      <stop offset="60%" stop-color="#0e0c08"/>
      <stop offset="100%" stop-color="#181410"/>
    </linearGradient>
    <!-- Wood grain gradient -->
    <linearGradient id="ss-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2c1a"/>
      <stop offset="25%" stop-color="#5a4228"/>
      <stop offset="50%" stop-color="#7a5c38"/>
      <stop offset="75%" stop-color="#5a4228"/>
      <stop offset="100%" stop-color="#3a2c1a"/>
    </linearGradient>
    <linearGradient id="ss-wood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a4e30"/>
      <stop offset="50%" stop-color="#4a3620"/>
      <stop offset="100%" stop-color="#2a1e10"/>
    </linearGradient>
    <!-- Leather pouch -->
    <linearGradient id="ss-leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="50%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#2a1c14"/>
    </linearGradient>
    <radialGradient id="ss-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a6040" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#8a6040" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8a6040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ss-stone" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a8880" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5a5850"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </radialGradient>
    <radialGradient id="ss-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <pattern id="ss-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#8a92a3" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="ss-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <!-- Wood grain pattern overlay -->
    <pattern id="ss-woodgrain" x="0" y="0" width="6" height="40" patternUnits="userSpaceOnUse">
      <path d="M 3 0 C 3.5 10 2.5 20 3 40" fill="none" stroke="#2a1e10" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
    <filter id="ss-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ss-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#ss-bg)"/>
  <rect width="600" height="600" fill="url(#ss-grid)"/>

  <!-- Faint warm aura -->
  <ellipse cx="300" cy="300" rx="200" ry="200" fill="url(#ss-aura)"/>

  <!-- HUD corners - gray common -->
  <g stroke="#8a92a3" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD label -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#8a92a3" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ SANDALWOOD-sling ] apprentice</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end" fill="#8a92a3">COMMON</text>
  </g>

  <!-- Y-FORK SLING (centered, handle pointing down) -->
  <g>
    <!-- Left fork arm -->
    <path d="M 300 230 C 280 220 245 200 225 170" fill="none" stroke="url(#ss-wood)" stroke-width="18" stroke-linecap="round"/>
    <!-- Left fork arm wood grain -->
    <path d="M 300 230 C 280 220 245 200 225 170" fill="none" stroke="#2a1e10" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>

    <!-- Right fork arm -->
    <path d="M 300 230 C 320 220 355 200 375 170" fill="none" stroke="url(#ss-wood)" stroke-width="18" stroke-linecap="round"/>
    <!-- Right fork arm wood grain -->
    <path d="M 300 230 C 320 220 355 200 375 170" fill="none" stroke="#2a1e10" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>

    <!-- Fork arm ends (rounded fork tips) -->
    <circle cx="225" cy="170" r="12" fill="#5a4228"/>
    <circle cx="375" cy="170" r="12" fill="#5a4228"/>
    <!-- Tip highlights -->
    <circle cx="222" cy="168" r="5" fill="#8a6a40" opacity="0.5"/>
    <circle cx="372" cy="168" r="5" fill="#8a6a40" opacity="0.5"/>

    <!-- Handle (vertical, pointing down) -->
    <rect x="289" y="228" width="22" height="170" rx="8" fill="url(#ss-wood2)"/>
    <!-- Wood grain texture on handle -->
    <rect x="289" y="228" width="22" height="170" rx="8" fill="url(#ss-woodgrain)" opacity="0.6"/>
    <!-- Handle highlight edge -->
    <line x1="291" y1="238" x2="291" y2="390" stroke="#8a6040" stroke-width="1" opacity="0.4"/>
    <!-- Handle knot/joint marks (natural wood look) -->
    <ellipse cx="300" cy="290" rx="9" ry="3" fill="#2a1e10" opacity="0.4"/>
    <ellipse cx="300" cy="340" rx="7" ry="2" fill="#2a1e10" opacity="0.3"/>

    <!-- Handle bottom cap -->
    <ellipse cx="300" cy="398" rx="13" ry="7" fill="#3a2c1a" stroke="#5a4228" stroke-width="1.5"/>

    <!-- LEATHER POUCH (at fork junction, holding stone) -->
    <!-- Sling bands from tips to pouch -->
    <path d="M 222 175 C 235 195 255 215 270 255" fill="none" stroke="#5a4030" stroke-width="2.5" stroke-opacity="0.8"/>
    <path d="M 378 175 C 365 195 345 215 330 255" fill="none" stroke="#5a4030" stroke-width="2.5" stroke-opacity="0.8"/>

    <!-- Pouch body (oval leather pouch) -->
    <ellipse cx="300" cy="285" rx="38" ry="30" fill="url(#ss-leather)" stroke="#4a3428" stroke-width="1.5"/>
    <!-- Pouch stitching lines -->
    <ellipse cx="300" cy="285" rx="33" ry="25" fill="none" stroke="#3a2820" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- Pouch folds -->
    <line x1="276" y1="275" x2="274" y2="295" stroke="#2a1e14" stroke-width="1" opacity="0.4"/>
    <line x1="286" y1="270" x2="284" y2="300" stroke="#2a1e14" stroke-width="1" opacity="0.3"/>

    <!-- STONE inside pouch (slightly peeking) -->
    <ellipse cx="300" cy="283" rx="24" ry="20" fill="url(#ss-stone)"/>
    <!-- Stone texture -->
    <ellipse cx="293" cy="278" rx="8" ry="5" fill="#9a9890" opacity="0.4"/>
    <path d="M 285 285 C 295 280 310 283 318 290" fill="none" stroke="#4a4840" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- "APPRENTICE GEAR" stamp -->
  <g opacity="0.3">
    <rect x="218" y="440" width="164" height="22" rx="2" fill="none" stroke="#8a92a3" stroke-width="1"/>
    <text x="300" y="455" font-family="ui-monospace, 'Courier New', monospace" font-size="9"
          letter-spacing="3" text-anchor="middle" fill="#8a92a3">APPRENTICE GEAR</text>
  </g>

  <!-- Minimal particles -->
  <g fill="#8a7060" opacity="0.2">
    <circle cx="180" cy="280" r="1"/>
    <circle cx="420" cy="260" r="1"/>
    <circle cx="190" cy="380" r="1"/>
    <circle cx="410" cy="360" r="1"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#ss-scanlines)" opacity="0.4"/>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#ss-vignette)"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#8a92a3" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// AMMO: STONE · RANGE: SHORT</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 0.2K</text>
  </g>
</svg>
