<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010a04"/>
      <stop offset="60%" stop-color="#041208"/>
      <stop offset="100%" stop-color="#082010"/>
    </linearGradient>
    <!-- Brass knuckle body -->
    <linearGradient id="rk-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a6040"/>
      <stop offset="35%" stop-color="#4a4028"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <linearGradient id="rk-brass-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="50%" stop-color="#8a7840"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <!-- Finger holes -->
    <radialGradient id="rk-hole" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="70%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#1a3a1a"/>
    </radialGradient>
    <radialGradient id="rk-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#39ff14" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rk-arc-center" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rk-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <pattern id="rk-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#39ff14" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="rk-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="rk-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rk-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rk-arcGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#rk-bg)"/>
  <rect width="600" height="600" fill="url(#rk-grid)"/>

  <!-- Green electric aura -->
  <ellipse cx="300" cy="300" rx="200" ry="160" fill="url(#rk-aura)"/>

  <!-- HUD corners - green rare -->
  <g stroke="#39ff14" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD label -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ RUNE-knuckles ] stun-protocol</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">▲ RARE</text>
  </g>

  <!-- BRASS KNUCKLES (4-finger plate, frontal view) -->
  <g>
    <!-- Knuckles outer glow -->
    <rect x="155" y="245" width="290" height="140" rx="16" fill="#39ff14" opacity="0.06" filter="url(#rk-softGlow)"/>

    <!-- Main plate body -->
    <rect x="160" y="250" width="280" height="135" rx="14" fill="url(#rk-brass)" stroke="#8a7840" stroke-width="2"/>
    <!-- Plate inner bevel (darker inset) -->
    <rect x="168" y="258" width="264" height="119" rx="10" fill="#2a2018" stroke="#4a4028" stroke-width="1"/>
    <!-- Horizontal highlight lines on plate -->
    <line x1="170" y1="275" x2="428" y2="275" stroke="#8a7840" stroke-width="0.8" opacity="0.4"/>
    <line x1="170" y1="360" x2="428" y2="360" stroke="#1a1808" stroke-width="1" opacity="0.5"/>

    <!-- FOUR FINGER HOLES -->
    <!-- Hole 1 (index) -->
    <circle cx="195" cy="300" r="38" fill="url(#rk-hole)" stroke="#39ff14" stroke-width="2"/>
    <circle cx="195" cy="300" r="30" fill="#000" stroke="#1a3a1a" stroke-width="1"/>
    <!-- Hole 2 (middle) -->
    <circle cx="268" cy="300" r="38" fill="url(#rk-hole)" stroke="#39ff14" stroke-width="2"/>
    <circle cx="268" cy="300" r="30" fill="#000" stroke="#1a3a1a" stroke-width="1"/>
    <!-- Hole 3 (ring) -->
    <circle cx="340" cy="300" r="38" fill="url(#rk-hole)" stroke="#39ff14" stroke-width="2"/>
    <circle cx="340" cy="300" r="30" fill="#000" stroke="#1a3a1a" stroke-width="1"/>
    <!-- Hole 4 (pinky) -->
    <circle cx="412" cy="300" r="38" fill="url(#rk-hole)" stroke="#39ff14" stroke-width="2"/>
    <circle cx="412" cy="300" r="30" fill="#000" stroke="#1a3a1a" stroke-width="1"/>

    <!-- NORSE RUNES etched in each hole ring -->
    <g font-family="serif" font-size="22" text-anchor="middle" fill="#39ff14" opacity="0.9" filter="url(#rk-hardGlow)">
      <text x="195" y="308">ᚠ</text>
      <text x="268" y="308">ᚢ</text>
      <text x="340" y="308">ᚦ</text>
      <text x="412" y="308">ᚨ</text>
    </g>

    <!-- Knuckle ridge bumps at top of each finger hole -->
    <g fill="url(#rk-brass-h)" stroke="#8a7840" stroke-width="1">
      <ellipse cx="195" cy="254" rx="28" ry="14"/>
      <ellipse cx="268" cy="254" rx="28" ry="14"/>
      <ellipse cx="340" cy="254" rx="28" ry="14"/>
      <ellipse cx="412" cy="254" rx="28" ry="14"/>
    </g>
    <!-- Knuckle bump shine -->
    <g fill="#8a7840" opacity="0.3">
      <ellipse cx="192" cy="250" rx="12" ry="5"/>
      <ellipse cx="265" cy="250" rx="12" ry="5"/>
      <ellipse cx="337" cy="250" rx="12" ry="5"/>
      <ellipse cx="409" cy="250" rx="12" ry="5"/>
    </g>

    <!-- Palm bar (bottom band connecting knuckles) -->
    <rect x="165" y="368" width="274" height="14" rx="4" fill="#3a3020" stroke="#6a5a28" stroke-width="1"/>
  </g>

  <!-- ELECTRIC ARCS between knuckle holes -->
  <!-- Arc 1-2 -->
  <g stroke="#39ff14" stroke-width="2" fill="none" filter="url(#rk-arcGlow)" opacity="0.8">
    <path d="M 223 285 C 235 270 250 275 242 260 C 248 270 258 265 246 285"/>
    <!-- Arc 2-3 -->
    <path d="M 296 280 C 308 265 322 270 316 255 C 322 268 332 262 320 280"/>
    <!-- Arc 3-4 -->
    <path d="M 368 282 C 380 267 394 272 388 257 C 394 270 404 264 392 282"/>
  </g>
  <!-- Arc spark core dots -->
  <g fill="#ffffff" opacity="0.8" filter="url(#rk-hardGlow)">
    <circle cx="244" cy="268" r="2"/>
    <circle cx="318" cy="263" r="2"/>
    <circle cx="390" cy="265" r="2"/>
  </g>

  <!-- Electric energy particles -->
  <g fill="#39ff14" opacity="0.6" filter="url(#rk-hardGlow)">
    <circle cx="150" cy="280" r="2"/>
    <circle cx="450" cy="270" r="1.5"/>
    <circle cx="145" cy="340" r="1"/>
    <circle cx="455" cy="330" r="1.5"/>
    <circle cx="200" cy="200" r="1"/>
    <circle cx="400" cy="195" r="1"/>
    <circle cx="195" cy="410" r="1.5"/>
    <circle cx="410" cy="400" r="1"/>
  </g>

  <!-- Stun electricity arcs (outer radiating arcs from sides) -->
  <g stroke="#39ff14" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#rk-softGlow)">
    <path d="M 160 280 L 130 270 L 120 280 L 130 290"/>
    <path d="M 440 280 L 470 270 L 480 280 L 470 290"/>
    <path d="M 200 415 L 190 440 L 200 445"/>
    <path d="M 400 415 L 410 440 L 400 445"/>
  </g>

  <!-- Green ring pulse decorations -->
  <g stroke="#39ff14" stroke-width="1" fill="none" opacity="0.2" stroke-dasharray="3 5">
    <circle cx="300" cy="300" r="160"/>
    <circle cx="300" cy="300" r="190"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#rk-scanlines)" opacity="0.4"/>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#rk-vignette)"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// STUN-CHANCE: 40% · ARC: ACTIVE</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 1.6K</text>
  </g>
</svg>
