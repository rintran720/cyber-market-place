<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="scr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="60%" stop-color="#120820"/>
      <stop offset="100%" stop-color="#1e0535"/>
    </linearGradient>
    <radialGradient id="scr-aura" cx="0.5" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#bd00ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scr-staff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e0618"/>
      <stop offset="50%" stop-color="#2e1a40"/>
      <stop offset="100%" stop-color="#0e0618"/>
    </linearGradient>
    <linearGradient id="scr-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0a3a"/>
      <stop offset="50%" stop-color="#5a1a78"/>
      <stop offset="100%" stop-color="#1a0828"/>
    </linearGradient>
    <radialGradient id="scr-sandstorm" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8800cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scr-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#bd00ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="scr-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="scr-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="scr-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="scr-turbulence" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="scr-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#scr-bg)"/>
  <rect width="600" height="600" fill="url(#scr-grid)"/>

  <!-- Desert haze aura -->
  <ellipse cx="300" cy="220" rx="210" ry="220" fill="url(#scr-aura)"/>

  <!-- HUD corners -->
  <g stroke="#bd00ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#bd00ff" opacity="0.9">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ SET-curse.rod ] duat-cyberware</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">◇ EPIC</text>
  </g>

  <!-- WAS-STAFF (vertical Egyptian staff) -->
  <g>
    <!-- Staff body (vertical, slightly tapered) -->
    <path d="M 290,240 L 286,530 L 298,535 L 314,530 L 310,240 Z"
          fill="url(#scr-staff)" stroke="#6a30a0" stroke-width="1.5"/>
    <!-- Staff edge highlight -->
    <line x1="290" y1="242" x2="288" y2="530" stroke="#9a50cc" stroke-width="1" opacity="0.5"/>

    <!-- Staff circuit traces -->
    <g stroke="#bd00ff" stroke-width="0.8" fill="none" opacity="0.4">
      <line x1="296" y1="250" x2="296" y2="525"/>
      <circle cx="296" cy="310" r="2" fill="#bd00ff"/>
      <circle cx="296" cy="380" r="2" fill="#bd00ff"/>
      <circle cx="296" cy="450" r="2" fill="#bd00ff"/>
    </g>

    <!-- Hieroglyph debuff icon on staff body -->
    <g font-family="serif" font-size="16" fill="#bd00ff" opacity="0.7" filter="url(#scr-hardGlow)" text-anchor="middle">
      <text x="300" y="340">𓃠</text>
      <text x="300" y="400">𓂀</text>
      <text x="300" y="460">𓆣</text>
    </g>

    <!-- Ground spike at bottom -->
    <polygon points="300,535 290,558 298,565 302,565 310,558" fill="#5a1a78" stroke="#9a40cc" stroke-width="1.5"/>

    <!-- SET ANIMAL HEAD (jackal-head with forked/aardvark top) -->
    <g transform="translate(300, 185)">
      <!-- Neck/base of head -->
      <rect x="-20" y="0" width="40" height="30" rx="5" fill="url(#scr-head)" stroke="#9a40cc" stroke-width="1.5"/>

      <!-- Head proper -->
      <ellipse cx="0" cy="-15" rx="30" ry="25" fill="url(#scr-head)" stroke="#9a40cc" stroke-width="2"/>

      <!-- SET EARS (distinctive rectangular/rounded ears) -->
      <!-- Left ear (square-topped, distinctive Set animal ear) -->
      <path d="M -22 -30 L -30 -60 L -22 -65 L -18 -35 Z" fill="url(#scr-head)" stroke="#bd00ff" stroke-width="1.5"/>
      <!-- Right ear -->
      <path d="M 22 -30 L 30 -60 L 22 -65 L 18 -35 Z" fill="url(#scr-head)" stroke="#bd00ff" stroke-width="1.5"/>

      <!-- FORKED TOP of staff (was-staff fork extending from head top) -->
      <!-- Left fork prong -->
      <path d="M -8 -38 C -12 -60, -16 -72, -14 -82 C -12 -90, -6 -92, -4 -84 C -2 -76, -6 -65, -4 -55"
            fill="url(#scr-head)" stroke="#9a40cc" stroke-width="2"/>
      <!-- Right fork prong -->
      <path d="M 8 -38 C 12 -60, 16 -72, 14 -82 C 12 -90, 6 -92, 4 -84 C 2 -76, 6 -65, 4 -55"
            fill="url(#scr-head)" stroke="#9a40cc" stroke-width="2"/>
      <!-- Fork base -->
      <rect x="-10" y="-42" width="20" height="10" rx="3" fill="#2a0a3a" stroke="#bd00ff" stroke-width="1.5"/>

      <!-- Jackal snout -->
      <path d="M -14 -8 C -14 4, -8 12, 0 14 C 8 12, 14 4, 14 -8"
            fill="url(#scr-head)" stroke="#9a40cc" stroke-width="1.5"/>
      <!-- Snout tip -->
      <ellipse cx="0" cy="14" rx="5" ry="3" fill="#5a1a78"/>

      <!-- Eyes -->
      <ellipse cx="-12" cy="-18" rx="6" ry="5" fill="#0e0618" stroke="#bd00ff" stroke-width="1.5"/>
      <ellipse cx="12" cy="-18" rx="6" ry="5" fill="#0e0618" stroke="#bd00ff" stroke-width="1.5"/>
      <circle cx="-12" cy="-18" r="3" fill="#bd00ff" opacity="0.8" filter="url(#scr-hardGlow)"/>
      <circle cx="12" cy="-18" r="3" fill="#bd00ff" opacity="0.8" filter="url(#scr-hardGlow)"/>

      <!-- Hieroglyph symbol on forehead -->
      <text x="0" y="-5" font-family="serif" font-size="10" fill="#bd00ff" text-anchor="middle" opacity="0.8">𓁱</text>
    </g>

    <!-- SANDSTORM PARTICLE CLOUD around top -->
    <g opacity="0.5" filter="url(#scr-softGlow)">
      <!-- Swirling sand particles -->
      <g fill="#bd00ff">
        <circle cx="220" cy="140" r="3"/>
        <circle cx="200" cy="165" r="2"/>
        <circle cx="215" cy="190" r="2.5"/>
        <circle cx="230" cy="120" r="1.5"/>
        <circle cx="380" cy="140" r="3"/>
        <circle cx="400" cy="165" r="2"/>
        <circle cx="385" cy="190" r="2.5"/>
        <circle cx="370" cy="120" r="1.5"/>
        <circle cx="250" cy="110" r="2"/>
        <circle cx="270" cy="95" r="1.5"/>
        <circle cx="330" cy="95" r="2"/>
        <circle cx="350" cy="110" r="1.5"/>
      </g>
      <!-- Sand swirl arcs -->
      <g stroke="#bd00ff" stroke-width="1" fill="none">
        <path d="M 195 155 C 210 140, 230 138, 245 148"/>
        <path d="M 355 148 C 370 138, 390 140, 405 155"/>
        <path d="M 240 100 C 260 90, 290 88, 310 90 C 330 92, 355 100, 360 110"/>
      </g>
    </g>
  </g>

  <!-- Purple desert haze wisps -->
  <g opacity="0.3" filter="url(#scr-turbulence)">
    <ellipse cx="300" cy="170" rx="80" ry="30" fill="#bd00ff"/>
    <ellipse cx="260" cy="155" rx="40" ry="15" fill="#8800cc"/>
    <ellipse cx="340" cy="155" rx="40" ry="15" fill="#8800cc"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#scr-scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#bd00ff" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// SANDSTORM: ARMED · SIGHT-DEBUFF: 100%</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 3.7K</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#scr-vignette)"/>
</svg>
