<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010a04"/>
      <stop offset="60%" stop-color="#041208"/>
      <stop offset="100%" stop-color="#0a2010"/>
    </linearGradient>
    <radialGradient id="pq-aura" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#39ff14" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pq-quiver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="50%" stop-color="#1e3a1e"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <linearGradient id="pq-arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a2a"/>
      <stop offset="50%" stop-color="#5a8a5a"/>
      <stop offset="100%" stop-color="#1a2a1a"/>
    </linearGradient>
    <radialGradient id="pq-flameTop" cx="0.5" cy="0.8" r="0.6">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#39ff14" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pq-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#39ff14" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="pq-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="pq-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pq-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="pq-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#pq-bg)"/>
  <rect width="600" height="600" fill="url(#pq-grid)"/>

  <!-- Green aura -->
  <ellipse cx="300" cy="280" rx="180" ry="200" fill="url(#pq-aura)"/>

  <!-- HUD corners -->
  <g stroke="#39ff14" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ PHOENIX-quiver ] rebirth-ordnance</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">▲ RARE</text>
  </g>

  <!-- CYLINDRICAL QUIVER body -->
  <g>
    <!-- Quiver cylinder (wide, centered) -->
    <!-- Bottom ellipse (base) -->
    <ellipse cx="300" cy="495" rx="68" ry="18" fill="#0a1a0a" stroke="#39ff14" stroke-width="1.5"/>
    <!-- Side walls -->
    <rect x="232" y="210" width="136" height="285" fill="url(#pq-quiver)" stroke="#39ff14" stroke-width="1.5"/>
    <!-- Top rim ellipse -->
    <ellipse cx="300" cy="210" rx="68" ry="18" fill="#1e3a1e" stroke="#39ff14" stroke-width="2"/>

    <!-- Quiver vertical seam lines -->
    <g stroke="#39ff14" stroke-width="0.8" opacity="0.3">
      <line x1="268" y1="210" x2="268" y2="494"/>
      <line x1="300" y1="192" x2="300" y2="494"/>
      <line x1="332" y1="210" x2="332" y2="494"/>
    </g>

    <!-- Circuit trace rings on quiver -->
    <g stroke="#39ff14" stroke-width="1" fill="none" opacity="0.5">
      <ellipse cx="300" cy="300" rx="68" ry="18"/>
      <ellipse cx="300" cy="360" rx="68" ry="18"/>
      <ellipse cx="300" cy="420" rx="68" ry="18"/>
    </g>

    <!-- LED charge nodes on rings -->
    <g fill="#39ff14" filter="url(#pq-hardGlow)">
      <circle cx="232" cy="300" r="2.5"/>
      <circle cx="368" cy="300" r="2.5"/>
      <circle cx="232" cy="360" r="2.5"/>
      <circle cx="368" cy="360" r="2.5"/>
      <circle cx="232" cy="420" r="2.5"/>
      <circle cx="368" cy="420" r="2.5"/>
    </g>

    <!-- PHOENIX WING EMBLEM on side -->
    <g transform="translate(300, 380)" filter="url(#pq-softGlow)">
      <!-- Left wing -->
      <path d="M -5 0 C -25 -30, -45 -45, -50 -25 C -52 -12, -38 -5, -25 0 C -12 5, -5 5, -5 0 Z"
            fill="#39ff14" opacity="0.5" stroke="#39ff14" stroke-width="1"/>
      <!-- Right wing -->
      <path d="M 5 0 C 25 -30, 45 -45, 50 -25 C 52 -12, 38 -5, 25 0 C 12 5, 5 5, 5 0 Z"
            fill="#39ff14" opacity="0.5" stroke="#39ff14" stroke-width="1"/>
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="5" ry="8" fill="#39ff14" opacity="0.9"/>
      <!-- Head -->
      <circle cx="0" cy="-10" r="4" fill="#39ff14" opacity="0.9"/>
      <!-- Tail feathers -->
      <path d="M -4 6 C -8 18, -12 24, -10 28" stroke="#39ff14" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M 0 8 C 0 20, 0 28, 2 32" stroke="#39ff14" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M 4 6 C 8 18, 12 24, 10 28" stroke="#39ff14" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>

    <!-- Flame-feather rim at top of quiver (radiating feathers) -->
    <g filter="url(#pq-softGlow)">
      <ellipse cx="300" cy="210" rx="72" ry="22" fill="url(#pq-flameTop)" opacity="0.6"/>
      <!-- Flame feather spikes around rim -->
      <g stroke="#39ff14" stroke-width="1.5" fill="none" opacity="0.8">
        <path d="M 252 200 C 248 185, 244 172, 250 165"/>
        <path d="M 268 196 C 266 180, 264 166, 270 158"/>
        <path d="M 284 194 C 284 178, 285 164, 292 156"/>
        <path d="M 300 193 C 300 177, 300 162, 300 154"/>
        <path d="M 316 194 C 316 178, 315 164, 308 156"/>
        <path d="M 332 196 C 334 180, 336 166, 330 158"/>
        <path d="M 348 200 C 352 185, 356 172, 350 165"/>
      </g>
    </g>
  </g>

  <!-- 3 ARROWS poking out top of quiver -->
  <!-- Arrow 1 (left, slightly tilted) -->
  <g transform="rotate(-8, 268, 210)">
    <line x1="268" y1="150" x2="268" y2="210" stroke="#5a8a5a" stroke-width="5" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <polygon points="268,115 260,145 276,145" fill="#39ff14" opacity="0.9" filter="url(#pq-hardGlow)"/>
    <!-- Fletching -->
    <path d="M 264 198 C 256 195, 252 188, 258 185" fill="#2a4a2a" stroke="#39ff14" stroke-width="0.8"/>
    <path d="M 272 198 C 280 195, 284 188, 278 185" fill="#2a4a2a" stroke="#39ff14" stroke-width="0.8"/>
  </g>
  <!-- Arrow 2 (center, straight) -->
  <g>
    <line x1="300" y1="130" x2="300" y2="210" stroke="#5a8a5a" stroke-width="5" stroke-linecap="round"/>
    <polygon points="300,100 292,130 308,130" fill="#39ff14" opacity="0.95" filter="url(#pq-softGlow)"/>
    <path d="M 296 198 C 288 195, 284 188, 290 185" fill="#2a4a2a" stroke="#39ff14" stroke-width="0.8"/>
    <path d="M 304 198 C 312 195, 316 188, 310 185" fill="#2a4a2a" stroke="#39ff14" stroke-width="0.8"/>
  </g>
  <!-- Arrow 3 (right, slightly tilted other way) -->
  <g transform="rotate(8, 332, 210)">
    <line x1="332" y1="150" x2="332" y2="210" stroke="#5a8a5a" stroke-width="5" stroke-linecap="round"/>
    <polygon points="332,115 324,145 340,145" fill="#39ff14" opacity="0.9" filter="url(#pq-hardGlow)"/>
    <path d="M 328 198 C 320 195, 316 188, 322 185" fill="#2a4a2a" stroke="#39ff14" stroke-width="0.8"/>
    <path d="M 336 198 C 344 195, 348 188, 342 185" fill="#2a4a2a" stroke="#39ff14" stroke-width="0.8"/>
  </g>

  <!-- Respawn timer LED display (on side of quiver) -->
  <g>
    <rect x="248" y="248" width="104" height="26" rx="4" fill="#000" stroke="#39ff14" stroke-width="1.5"/>
    <text x="300" y="265" font-family="ui-monospace,'Courier New',monospace" font-size="13"
          fill="#39ff14" text-anchor="middle" font-weight="700" filter="url(#pq-hardGlow)">00:03:00</text>
  </g>

  <!-- Flame particles rising from rim -->
  <g fill="#39ff14" opacity="0.65" filter="url(#pq-hardGlow)">
    <circle cx="255" cy="155" r="2"/>
    <circle cx="270" cy="140" r="1.5"/>
    <circle cx="300" cy="130" r="2"/>
    <circle cx="330" cy="142" r="1.5"/>
    <circle cx="345" cy="155" r="2"/>
    <circle cx="280" cy="132" r="1"/>
    <circle cx="320" cy="135" r="1"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#pq-scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#39ff14" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// RESPAWN: 00:03:00 · ARROWS: AUTO-REGEN</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 0.98K</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#pq-vignette)"/>
</svg>
