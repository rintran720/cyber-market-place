<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ca-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="60%" stop-color="#120820"/>
      <stop offset="100%" stop-color="#1e0535"/>
    </linearGradient>
    <radialGradient id="ca-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#bd00ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ca-claw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="45%" stop-color="#7a5a8a"/>
      <stop offset="70%" stop-color="#ddc8ee"/>
      <stop offset="100%" stop-color="#1a0a28"/>
    </linearGradient>
    <linearGradient id="ca-gauntlet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e0e2e"/>
      <stop offset="50%" stop-color="#2e1a3e"/>
      <stop offset="100%" stop-color="#0e0618"/>
    </linearGradient>
    <radialGradient id="ca-mortGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#bd00ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ca-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#bd00ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="ca-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="ca-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ca-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="ca-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#ca-bg)"/>
  <rect width="600" height="600" fill="url(#ca-grid)"/>

  <!-- Mortuary glow -->
  <ellipse cx="300" cy="280" rx="200" ry="200" fill="url(#ca-aura)"/>

  <!-- HUD corners -->
  <g stroke="#bd00ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#bd00ff" opacity="0.9">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ CLAWS-of-ANUBIS ] duat-cyberware</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">◇ EPIC</text>
  </g>

  <!-- FOREARM GAUNTLET -->
  <g>
    <!-- Gauntlet main body (forearm plate) -->
    <rect x="180" y="340" width="240" height="100" rx="12" fill="url(#ca-gauntlet)" stroke="#7a30aa" stroke-width="2"/>
    <!-- Gauntlet panels -->
    <rect x="192" y="352" width="216" height="76" rx="8" fill="#0e0618" stroke="#5a1a8a" stroke-width="1"/>
    <!-- Panel lines -->
    <line x1="260" y1="352" x2="260" y2="428" stroke="#bd00ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="340" y1="352" x2="340" y2="428" stroke="#bd00ff" stroke-width="0.8" opacity="0.4"/>

    <!-- Hieroglyph engravings on gauntlet -->
    <g font-family="serif" font-size="18" fill="#bd00ff" opacity="0.7" filter="url(#ca-hardGlow)" text-anchor="middle">
      <text x="230" y="395">𓂀</text>
      <text x="300" y="395">𓃠</text>
      <text x="370" y="395">𓆣</text>
    </g>

    <!-- LED strip -->
    <rect x="192" y="430" width="216" height="4" rx="2" fill="#bd00ff" opacity="0.5" filter="url(#ca-softGlow)"/>

    <!-- Wrist connector rings -->
    <rect x="170" y="350" width="16" height="80" rx="4" fill="#2e1a3e" stroke="#9a40cc" stroke-width="1"/>
    <rect x="414" y="350" width="16" height="80" rx="4" fill="#2e1a3e" stroke="#9a40cc" stroke-width="1"/>

    <!-- Knuckle nodes (finger attachment points) -->
    <g fill="#2e1a3e" stroke="#bd00ff" stroke-width="1.5">
      <rect x="196" y="336" width="30" height="18" rx="4"/>
      <rect x="240" y="334" width="30" height="20" rx="4"/>
      <rect x="284" y="332" width="32" height="22" rx="4"/>
      <rect x="330" y="334" width="30" height="20" rx="4"/>
      <rect x="374" y="336" width="30" height="18" rx="4"/>
    </g>
  </g>

  <!-- THREE MAIN CLAWS (curving forward, Egyptian-tipped) -->
  <!-- Claw 1 (left) -->
  <g filter="url(#ca-softGlow)">
    <path d="M 215 334 C 200 280, 185 220, 170 160 C 165 140, 172 125, 185 118 C 195 112, 205 120, 208 140 C 212 165, 215 200, 220 240 L 228 334"
          fill="url(#ca-claw)" stroke="#9a50cc" stroke-width="2"/>
    <!-- Claw tip Egyptian spear-head shape -->
    <polygon points="175,115 185,100 195,115 190,130 180,130" fill="#ddc8ee" stroke="#bd00ff" stroke-width="1" filter="url(#ca-softGlow)"/>
    <circle cx="185" cy="108" r="4" fill="#bd00ff" filter="url(#ca-softGlow)"/>
  </g>

  <!-- Claw 2 (center, tallest) -->
  <g filter="url(#ca-softGlow)">
    <path d="M 286 330 C 286 265, 288 200, 290 145 C 291 118, 298 105, 308 100 C 318 96, 325 108, 324 132 C 322 162, 318 210, 316 260 L 314 330"
          fill="url(#ca-claw)" stroke="#9a50cc" stroke-width="2"/>
    <!-- Tip -->
    <polygon points="302,97 312,80 322,97 317,115 307,115" fill="#ddc8ee" stroke="#bd00ff" stroke-width="1" filter="url(#ca-softGlow)"/>
    <circle cx="312" cy="88" r="5" fill="#bd00ff" filter="url(#ca-softGlow)"/>
  </g>

  <!-- Claw 3 (right) -->
  <g filter="url(#ca-softGlow)">
    <path d="M 372 334 C 385 278, 400 218, 416 162 C 422 140, 418 124, 406 118 C 396 113, 386 122, 383 145 C 378 172, 374 210, 372 252 L 370 334"
          fill="url(#ca-claw)" stroke="#9a50cc" stroke-width="2"/>
    <!-- Tip -->
    <polygon points="407,115 418,100 428,115 423,130 413,130" fill="#ddc8ee" stroke="#bd00ff" stroke-width="1" filter="url(#ca-softGlow)"/>
    <circle cx="418" cy="108" r="4" fill="#bd00ff" filter="url(#ca-softGlow)"/>
  </g>

  <!-- Mortuary glow emanation from tips -->
  <ellipse cx="185" cy="112" rx="25" ry="25" fill="#bd00ff" opacity="0.12" filter="url(#ca-softGlow)"/>
  <ellipse cx="312" cy="88" rx="30" ry="30" fill="#bd00ff" opacity="0.15" filter="url(#ca-softGlow)"/>
  <ellipse cx="418" cy="112" rx="25" ry="25" fill="#bd00ff" opacity="0.12" filter="url(#ca-softGlow)"/>

  <!-- Purple mist particles around tips -->
  <g fill="#bd00ff" opacity="0.6" filter="url(#ca-hardGlow)">
    <circle cx="155" cy="100" r="2"/>
    <circle cx="170" cy="85" r="1.5"/>
    <circle cx="165" cy="130" r="1"/>
    <circle cx="295" cy="72" r="2"/>
    <circle cx="325" cy="80" r="1.5"/>
    <circle cx="310" cy="60" r="1"/>
    <circle cx="440" cy="100" r="2"/>
    <circle cx="455" cy="118" r="1.5"/>
    <circle cx="430" cy="88" r="1"/>
  </g>

  <!-- Floating hieroglyph particles -->
  <g font-family="serif" font-size="10" fill="#bd00ff" opacity="0.5" filter="url(#ca-hardGlow)">
    <text x="100" y="180">𓂀</text>
    <text x="480" y="200">𓃠</text>
    <text x="90" y="420">𓆣</text>
    <text x="490" y="430">𓄿</text>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#ca-scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#bd00ff" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// SOUL-MARK: ARMED · DUAT-LINK: ACTIVE</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 2.1K</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#ca-vignette)"/>
</svg>
