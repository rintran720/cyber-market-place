<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="60%" stop-color="#120820"/>
      <stop offset="100%" stop-color="#1e0535"/>
    </linearGradient>
    <radialGradient id="bc-aura" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#bd00ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bc-bow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050008"/>
      <stop offset="50%" stop-color="#120020"/>
      <stop offset="100%" stop-color="#050008"/>
    </linearGradient>
    <linearGradient id="bc-grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0828"/>
      <stop offset="50%" stop-color="#2a1040"/>
      <stop offset="100%" stop-color="#0e0418"/>
    </linearGradient>
    <radialGradient id="bc-soulDrain" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#5500aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bc-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#bd00ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="bc-scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <filter id="bc-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bc-hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bc-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BACKDROP -->
  <rect width="600" height="600" fill="url(#bc-bg)"/>
  <rect width="600" height="600" fill="url(#bc-grid)"/>

  <!-- Soul drain mist -->
  <ellipse cx="300" cy="300" rx="220" ry="200" fill="url(#bc-aura)"/>

  <!-- HUD corners -->
  <g stroke="#bd00ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 580 20 L 580 60 M 580 20 L 540 20"/>
    <path d="M 20 580 L 20 540 M 20 580 L 60 580"/>
    <path d="M 580 580 L 580 540 M 580 580 L 540 580"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#bd00ff" opacity="0.9">
    <text x="40" y="48" font-size="12" letter-spacing="3">[ BLACKBOW.cursed ] tartarus-trade</text>
    <text x="560" y="48" font-size="11" letter-spacing="2" text-anchor="end">◇ EPIC</text>
  </g>

  <!-- INVERTED BLACK BOW (curving downward) -->
  <g>
    <!-- Left limb of bow (inverted - tips curve downward and out) -->
    <path d="M 300,220 C 270,240 200,290 155,350 C 140,370 140,388 152,398 C 162,406 178,402 192,386 C 215,358 250,320 280,300"
          fill="none" stroke="url(#bc-bow)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 300,220 C 270,240 200,290 155,350 C 140,370 140,388 152,398 C 162,406 178,402 192,386 C 215,358 250,320 280,300"
          fill="none" stroke="#4a0080" stroke-width="12" stroke-linecap="round"/>
    <!-- Left limb edge highlight -->
    <path d="M 300,220 C 270,240 200,290 155,350 C 140,370 140,388 152,398"
          fill="none" stroke="#9a00cc" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Right limb of bow -->
    <path d="M 300,220 C 330,240 400,290 445,350 C 460,370 460,388 448,398 C 438,406 422,402 408,386 C 385,358 350,320 320,300"
          fill="none" stroke="url(#bc-bow)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 300,220 C 330,240 400,290 445,350 C 460,370 460,388 448,398 C 438,406 422,402 408,386 C 385,358 350,320 320,300"
          fill="none" stroke="#4a0080" stroke-width="12" stroke-linecap="round"/>
    <path d="M 300,220 C 330,240 400,290 445,350 C 460,370 460,388 448,398"
          fill="none" stroke="#9a00cc" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- BOWSTRING - 3 Furies hair strands woven -->
    <line x1="159" y1="398" x2="156" y2="150" stroke="#bd00ff" stroke-width="1.2" opacity="0.6"/>
    <line x1="163" y1="396" x2="160" y2="148" stroke="#8a00cc" stroke-width="0.8" opacity="0.5" stroke-dasharray="4 3"/>
    <line x1="167" y1="394" x2="164" y2="146" stroke="#bd00ff" stroke-width="1" opacity="0.4"/>
    <!-- Right string strands -->
    <line x1="441" y1="398" x2="444" y2="150" stroke="#bd00ff" stroke-width="1.2" opacity="0.6"/>
    <line x1="437" y1="396" x2="440" y2="148" stroke="#8a00cc" stroke-width="0.8" opacity="0.5" stroke-dasharray="4 3"/>
    <line x1="433" y1="394" x2="436" y2="146" stroke="#bd00ff" stroke-width="1" opacity="0.4"/>
    <!-- Upper string connecting tips -->
    <path d="M 158 155 C 220 140, 380 140, 442 150" fill="none" stroke="#bd00ff" stroke-width="1.5" opacity="0.7"/>
    <path d="M 158 155 C 220 145, 380 145, 442 150" fill="none" stroke="#8a00cc" stroke-width="0.8" opacity="0.5" stroke-dasharray="5 4"/>

    <!-- GRIP with SKULL MOTIF (center of bow) -->
    <g transform="translate(300, 220)">
      <!-- Grip body -->
      <rect x="-16" y="-28" width="32" height="56" rx="6" fill="url(#bc-grip)" stroke="#9a00cc" stroke-width="2"/>
      <!-- Skull emblem -->
      <g filter="url(#bc-hardGlow)">
        <!-- Skull head -->
        <circle cx="0" cy="-8" r="12" fill="#0e0418" stroke="#bd00ff" stroke-width="1.5"/>
        <!-- Eye sockets -->
        <ellipse cx="-5" cy="-10" rx="3.5" ry="4" fill="#bd00ff" opacity="0.8"/>
        <ellipse cx="5" cy="-10" rx="3.5" ry="4" fill="#bd00ff" opacity="0.8"/>
        <!-- Nose -->
        <ellipse cx="0" cy="-5" rx="2" ry="2.5" fill="#4a0080"/>
        <!-- Jaw -->
        <rect x="-8" y="-2" width="16" height="8" rx="4" fill="#0e0418" stroke="#bd00ff" stroke-width="1"/>
        <!-- Teeth -->
        <g fill="#bd00ff" opacity="0.7">
          <rect x="-6" y="-2" width="3" height="5" rx="1"/>
          <rect x="-2" y="-2" width="3" height="5" rx="1"/>
          <rect x="2" y="-2" width="3" height="5" rx="1"/>
        </g>
      </g>
      <!-- Grip wraps -->
      <g stroke="#9a00cc" stroke-width="1" opacity="0.6">
        <line x1="-15" y1="10" x2="15" y2="12"/>
        <line x1="-15" y1="18" x2="15" y2="20"/>
      </g>
    </g>
  </g>

  <!-- SOUL DRAIN MIST flowing upward -->
  <g opacity="0.5" filter="url(#bc-softGlow)">
    <!-- Mist tendrils -->
    <path d="M 200 380 C 210 350, 200 320, 215 290 C 228 262, 240 250, 255 230"
          fill="none" stroke="#bd00ff" stroke-width="2" stroke-dasharray="3 4"/>
    <path d="M 400 380 C 390 350, 400 320, 385 290 C 372 262, 360 250, 345 230"
          fill="none" stroke="#bd00ff" stroke-width="2" stroke-dasharray="3 4"/>
    <path d="M 300 300 C 295 275, 305 250, 300 220"
          fill="none" stroke="#bd00ff" stroke-width="1.5" stroke-dasharray="3 4"/>
  </g>

  <!-- Purple soul particles -->
  <g fill="#bd00ff" opacity="0.6" filter="url(#bc-hardGlow)">
    <circle cx="160" cy="200" r="2"/>
    <circle cx="440" cy="200" r="1.5"/>
    <circle cx="180" cy="150" r="1"/>
    <circle cx="420" cy="150" r="1.5"/>
    <circle cx="220" cy="130" r="2"/>
    <circle cx="380" cy="130" r="1.5"/>
    <circle cx="300" cy="120" r="2"/>
    <circle cx="260" cy="140" r="1"/>
    <circle cx="340" cy="140" r="1"/>
  </g>

  <!-- SCANLINES -->
  <rect width="600" height="600" fill="url(#bc-scanlines)" opacity="0.4"/>

  <!-- HUD bottom -->
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#bd00ff" opacity="0.85">
    <text x="40" y="568" font-size="10" letter-spacing="2">// SOUL-DRAIN: ACTIVE · FURY-STRING: WOVEN</text>
    <text x="560" y="568" font-size="10" letter-spacing="2" text-anchor="end" fill="#fcee0a">⟁ 3.3K</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#bc-vignette)"/>
</svg>
